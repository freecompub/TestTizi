hypotheses:
  - id: H-001
    text: "« courses de soutien et de langues » désigne des COURS : soutien scolaire et cours de langues"
    basis: "lecture de la demande ; coquille probable"
    status: à vérifier
  - id: H-002
    text: "Les deux initiatives filles concernent la même population (les mêmes familles) et partagent le même référentiel de personnes"
    basis: "déduction : les parents apparaissent dans les deux problèmes"
    status: à vérifier
  - id: H-003
    text: "Une séance transformée en rattrapage a un coût pour l'association au-delà du temps : cours payés par les familles, programme décalé, confiance entamée"
    basis: "déduction à partir de « association de cours de soutien » ; non confirmé"
    status: à vérifier
  - id: H-004
    text: "Les deux initiatives filles partagent le même canal (WhatsApp) et le même référentiel de familles : les traiter séparément recréerait deux fois la même liste de personnes"
    basis: "SRC-001 : la validation d'inscription est annoncée via WhatsApp"
    status: à vérifier
  - id: H-005
    text: "Dédé, directeur de l'association, peut rendre seul la décision d'opportunité et engager le projet"
    basis: "déclaré par Samir (SH-01), parent d'élève, pas par Dédé ni par les statuts"
    status: à vérifier
  - id: H-011
    text: "Les groupes sont recréés et peuplés à la main alors qu'une liste nom / prénom / téléphone existe déjà dans le fichier Excel des inscriptions : les erreurs d'affectation viendraient d'une recopie manuelle d'une liste qui existe"
    basis: "SRC-004 de l'initiative sœur ; non vérifié auprès de qui crée les groupes"
    status: à vérifier
  - id: H-007
    text: "Ce problème fait souffrir les enseignants et les élèves (non entendus, non mesuré), pas les familles : aucun parent ne s'en est plaint en réunion"
    basis: "SRC-001 : le mécontentement exprimé ne portait que sur les inscriptions"
    status: à vérifier
