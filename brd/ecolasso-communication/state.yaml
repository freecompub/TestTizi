# État de session d'une initiative BRD — mis à jour par l'agent après chaque échange validé.
document: brd
initiative:
  name: "EcolAsso — Communication et devoirs"
  slug: "ecolasso-communication"
  trigger: "Aucun déclencheur propre : le déclencheur d'EcolAsso (« on veut plus avoir des problème avec les parents ») portait sur les inscriptions, pas sur la communication. Pourquoi maintenant reste à établir (ZO-022)."
  derived_from:
    initiative: ecolasso
    reason: decoupage
    decision: "décision d'opportunité d'EcolAsso du 2026-10-27 (decoupee), rendue par SH-02"
  # d'où elle vient, quand elle ne naît pas d'une demande mais d'une autre
                         # initiative. Renseigne `derived_from` à la création : `split_into` ne dit la
                         # filiation que vers le bas, et seulement depuis une mère close
  #  initiative: ""      # slug de l'initiative d'origine
  #  reason: decoupage   # decoupage | sortie_perimetre | autre:<libellé>
  #  decision: ""        # la décision qui l'a produite, chez la mère : DD-xx, ou sa décision d'opportunité
phase: discover          # assess | discover | define | govern | close (opportunité jetée)
created: "2026-10-27"              # AAAA-MM-JJ
updated: "2026-10-27"

opportunity:              # phase Assess (references/phase-assess.md)
  request:
    verbatim: |
      Héritée d'EcolAsso (SRC-001, verbatim de SH-01) : l'association utiliser WhatsApp pour la communication parents profs, Prof élevé, c'est problématique puisque chaque année, les groupes sont créés de zéro, il y a déjà les erreur d'affection des bonnes personnes aux bon groupe. Les groupes sont un mix entre parents et élèves, les messages sont mixé. Les devoirs sont envoyés sur ces groupes avec les erreurs d'envoi sur le mauvais groupe.
    
    classification: figee  # héritée d'EcolAsso : le nom portait déjà une solution — figee (une solution précise, qui masque souvent le problème) | fluide (une aspiration vague)
    presumed_solution: ""  # pour une demande figée : la solution présumée, à remonter au problème
  canvas:
    problems:
      - "P1 — Communication sur WhatsApp : groupes recréés de zéro chaque année, erreurs d'affectation des personnes aux groupes, groupes mixant parents et élèves, messages mélangés, devoirs envoyés sur le mauvais groupe"
      - "P1a — Détection de l'erreur d'envoi : rien ne la signale. Si l'enseignant ne s'en rend pas compte, l'erreur persiste jusqu'à ce qu'un membre du groupe la signale — acteur et délai inconnus (ZO-010)"
      - "P1b — Conséquence (SRC-007, SH-03, membre du bureau) : les élèves du groupe qui n'a pas reçu le devoir arrivent sans l'avoir fait, et la séance se transforme en séance de rattrapage. Attribution corrigée le 2026-10-27 : ce récit avait d'abord été enregistré au nom d'un parent, il est de Tom. Il reste rapporté — Tom n'enseigne pas"
      - "P1c — Ampleur (SRC-001) : 10 groupes de cours, donc au moins 10 groupes WhatsApp recréés de zéro chaque année, à peupler avec 150 élèves et leurs parents. Fréquence des erreurs non mesurée (ZO-005)"
    users:
      - "Professeurs (SH-04) — non entendus"
      - "Élèves (SH-05) — non entendus"
      - "Parents d'élèves (SH-01)"
      - "Qui crée et peuple les groupes chaque année : non identifié (ZO-007)"
    solutions_today:
      - "WhatsApp, groupes recréés chaque année, mélangeant parents et élèves (communication et envoi des devoirs)"
    user_value: ""         # non établi : les porteurs de la douleur n'ont pas été entendus
    user_metrics: []
    adoption: ""
    business_problem: "Non établi. Aucun parent ne s'est plaint de P1 ; le coût supposé est du temps d'enseignement perdu, rapporté par un parent et non mesuré (H-003, ZO-022)"
    business_metrics: []
    budget: "quelques mois"   # budget annoncé pour l'ensemble, à répartir entre les deux filles (ZO-023)
  decision: aller_plus_loin   # rendue par SH-02, déclarée par l'utilisateur — en_attente | aller_plus_loin | jeter | decoupee | a_apprendre | reportee
  reason: "Décision rendue malgré l'absence de preuve : la fréquence des erreurs n'est pas mesurée (ZO-005) et les seuls porteurs de la douleur — enseignants et élèves — n'ont jamais été entendus (ZO-006). Discover n'engage pas à construire ; ces deux zones sont ce qu'il doit lever en premier, et leur réponse peut encore clore l'initiative."
  to_learn: []             # si a_apprendre : - { question: "", who: "" }
  split_into: []           # si decoupee : slugs des initiatives filles. Sans eux, « close » se relit
                           # comme un abandon — ce qui est arrivé, avec la vérité en commentaire YAML
  decided_by: SH-02        # Dédé, directeur de l'association — déclaré par l'utilisateur
  date: "2026-10-27"

