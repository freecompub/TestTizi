    blocking: false
    posee: [{ date: "2026-11-05", canal: "vive voix" }]
    status: levée
    resolution: "Quatre points nommés par Dédé (SRC-003) : ressaisie annuelle des mêmes données multipliée par le nombre d'enfants ; retrait du formulaire au bureau ou via l'enfant ; dépôt réservé au parent, au bureau ; destruction des dossiers en fin d'année."
    related: [SRC-002, SRC-003]
  - id: ZO-005
    type: attendu_implicite
    question: "Pourquoi les dossiers papier sont-ils détruits à chaque fin d'année : une obligation, une consigne de l'association, un manque de place, ou l'usage ?"
