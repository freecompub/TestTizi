  - id: ZO-002
    type: partie_prenante_non_entendue
    question: "Que vit un enseignant pendant une inscription : ce qu'on lui demande, ce qu'il fait, ce qui lui manque au moment où il le fait ? Un fait ou une règle se relaient, un geste et un vécu non — Tom ne peut pas les donner à sa place."
    origin: cadrage
    ask_to: SH-04
    action: entretien
    blocking: false
    posee: []
    status: ouverte
    related: [SRC-001]
  - id: ZO-003
    type: partie_prenante_non_entendue
    question: "Comment une famille vit-elle une inscription aujourd'hui, de son côté, du premier contact au dossier complet ?"
    origin: cadrage
    ask_to: "parent d'élève à identifier (Samir les représente, il ne les remplace pas)"
    action: entretien
    blocking: false
    posee: []
    status: ouverte
    related: [SRC-001]
  - id: ZO-004
    type: probleme_flou
    question: "Dans la campagne d'avril à juin, qu'est-ce qui coince aujourd'hui : qu'est-ce qui prend du temps, se perd, se refait, ou revient en arrière ?"
    origin: SRC-002
    ask_to: SH-02
