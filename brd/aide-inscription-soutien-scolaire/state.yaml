  - id: R-02
    text: "La même personne décide, arbitre et approuvera le document : il n'existe personne au-dessus du directeur dans l'association. Rien ne contredira donc une erreur de cadrage avant qu'elle ne coûte quelque chose, et une approbation ne vaudra pas plus qu'une relecture par son propre auteur."
    origin: ZO-030
    related: [SH-02, SH-01, SH-03, SRC-022, SRC-023]
    likelihood: moyenne
    impact: fort
    response: "Faire porter le contrôle par le retour à la source plutôt que par la hiérarchie, qui n'existe pas : faire relire à Samir ce qui est écrit au nom des parents, à Tom et Toto ce qui est écrit au nom des professeurs, et n'enregistrer une approbation qu'après ces retours. C'est le seul contre-pouvoir disponible dans cette structure."
    status: proposé
  - id: R-01
    text: "La construction des groupes étant sortie du périmètre, un besoin des professeurs sur ce que le fichier doit leur apporter risque de ne jamais être entendu. Ce que le tri a de difficile n'est pas connu, et aucun enseignant n'a parlé en son nom : une inscription refondue pourrait servir les familles et le bureau sans servir l'usage auquel le fichier est finalement destiné."
    origin: ZO-027
    related: [ZO-027, ZO-028, SH-03, SH-04, RG-001, DD-01]
    likelihood: moyenne
    impact: moyen
    response: "Faire relire la formulation du problème et le périmètre par les deux représentants des professeurs avant la fin de la phase, et rouvrir le périmètre si l'un d'eux signale un manque. Le retour de source prévu sur les entretiens de Tom est le moment le moins coûteux pour le faire."
    status: proposé
