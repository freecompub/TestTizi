candidate_needs:
  - id: BC-001
    text: "Qu'une famille déjà connue n'ait pas à réécrire chaque année les données que l'association détient déjà, ni à les répéter pour chacun de ses enfants"
    sources: [{ ref: SRC-003, location: "point 1" }, { ref: SRC-005 }]
    concerns: [SH-01]
    status: confirmé
    notes: "Formulé pour les familles, qu'on n'a pas encore entendues en direct (ZO-003). Dépend de H-001 : si les données ne peuvent pas être conservées d'une année sur l'autre, ce besoin tombe."
  - id: BC-002
    text: "Que le retour du dossier rempli ne dépende pas d'un déplacement d'un parent au bureau"
    sources: [{ ref: SRC-003, location: "points 2 et 3" }]
    concerns: [SH-01]
    status: proposé
    notes: "Asymétrie relevée par Dédé : le formulaire peut sortir via l'enfant, il ne peut pas revenir par lui. La raison de cette asymétrie n'est pas encore dite."
  - id: BC-003
    text: "Que l'association retrouve d'une année sur l'autre ce qu'elle a déjà recueilli auprès d'une famille"
    sources: [{ ref: SRC-003, location: "point 4" }, { ref: SRC-015 }]
    concerns: [SH-02]
    status: proposé
    notes: "À reformuler : l'association retrouve DÉJÀ une partie — le fichier Excel survit à la campagne suivante. Ce qui manque est le reste du dossier, que le fichier ne porte pas et que le papier emporte en étant détruit. Le besoin porte sur cet écart, pas sur la conservation en général."
  - id: BC-004
    text: "Que l'inscription d'une famille ne repose pas sur l'absence d'erreur au remplissage du formulaire"
    sources: [{ ref: SRC-005 }, { ref: SRC-019 }]
    concerns: [SH-01]
    status: proposé
    notes: "Soulevé par Samir en passant. Ce qu'une erreur coûte aujourd'hui — ce qui est refait, par qui, quand c'est découvert — n'est pas encore dit (ZO-009). Une conséquence est maintenant connue : le groupe d'un enfant est décidé sur le niveau scolaire que le parent a recopié sur le formulaire, sans contrôle des professeurs (SRC-019)."
  - id: BC-005
    text: "Que le bureau n'ait pas à retaper les données qu'une famille vient d'écrire sur le formulaire papier"
    sources: [{ ref: SRC-008 }]
    concerns: [SH-02]
    status: proposé
    notes: "Versant organisation de BC-001 : la même donnée est écrite deux fois, une fois par la famille et une fois par le bureau. Formulé pour les membres du bureau, dont seul Dédé a été entendu."
  - id: BC-006
    text: "Que le rapprochement entre un paiement et une inscription ne se fasse pas en relevant les références de virement à la main"
    sources: [{ ref: SRC-008 }]
    concerns: [SH-02]
    status: proposé
    notes: "Le lot de 10 à 20 inscriptions est la cadence du contrôle, pas celle des dépôts : une famille reste « pré-validée » jusqu'au prochain lot. Ce que ce délai lui coûte n'est pas encore dit."
