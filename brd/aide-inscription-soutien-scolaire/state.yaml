# État de session d'une initiative BRD — mis à jour par l'agent après chaque échange validé.
document: brd
initiative:
  name: "Aide d'une association de soutien scolaire dans le processus d'inscription"
  slug: "aide-inscription-soutien-scolaire"
  trigger: ""            # pourquoi maintenant
  requested_by: ""       # SH-xx : QUI a demandé cette initiative. Obligatoire dès qu'on écrit à
                         # quelqu'un par un canal (`reach-out.mjs` refuse sans lui) : « je vous écris
                         # à la demande de … » est la ligne qui rattache le message à ce dont on a
                         # parlé à la personne, et c'est elle qui rend le contact légitime maintenant
                         # que le consentement est du côté de l'utilisateur. Elle se lisait avant à
                         # `request.requested_by` — un chemin qui n'existait dans aucun gabarit —, avec
                         # un rattrapage par mot-clé sur les rôles : sur le dossier réel les deux
                         # étaient muets, et la clause disparaissait sans trace. Ne la devine pas :
                         # nommer la mauvaise personne lui fait dire qu'elle a demandé une démarche
                         # dont elle n'a pas entendu parler
  derived_from: {}       # d'où elle vient, quand elle ne naît pas d'une demande mais d'une autre
                         # initiative. Renseigne `derived_from` à la création : `split_into` ne dit la
                         # filiation que vers le bas, et seulement depuis une mère close
  #  initiative: ""      # slug de l'initiative d'origine
  #  reason: decoupage   # decoupage | sortie_perimetre | autre:<libellé>
  #  decision: ""        # la décision qui l'a produite, chez la mère : DD-xx, ou sa décision d'opportunité
phase: discover          # assess | discover | define | govern | close (opportunité jetée)

phase_log:
  - from: assess
    to: discover
    date: "2026-11-05"
    decided_by: SH-02
    source: SRC-017
    gate: "5 condition(s) tenue(s) sur 7 mesurées"
    kind: porte
    waived:
      - condition: "chaque zone d'ombre est levée ou assumée"
        reason: "18 zones restent ouvertes et aucune n'est bloquante. Elles sont le programme de la découverte, qui a précisément pour objet de les lever : les assumer ici reviendrait à décider de ne jamais les poser. Dérogation portée par la décision d'opportunité de Dédé."
      - condition: "aucun avertissement ni corrigé ni dérogé (lint.mjs)"
        reason: "Deux avertissements restent, et les deux sont justes : aucun utilisateur direct n'a parlé en son nom, et le locuteur du tour de table d'ouverture n'est pas établi. Ils ne sont pas dérogés sur le fond mais repris comme les deux premières actions de la découverte — entendre une famille et un enseignant, et retrouver qui a répondu à l'ouverture."
#                          # une porte franchie, une entrée — `phase` dit la phase EN COURS, `phase_log` dit
                         # comment on y est arrivé. « Un changement de phase se demande : ce n'est pas la
                         # suite du travail, c'est une porte, et il s'écrit dans l'état avec sa date »
                         # (references/questions.md). Le champ manquait : au deuxième dossier réel l'agent
                         # a écrit le passage en COMMENTAIRE, que rien ne lit et que le document rendu ne
                         # peut pas reprendre. S100 réclame la trace, S101 son décideur et sa date.
#  - from: discover      # la phase qui se clôt
#    to: define          # celle qui s'ouvre
#    date: ""            # AAAA-MM-JJ
#    decided_by: SH-02   # qui a tranché — déclaré par l'utilisateur, jamais déduit
#    source: SRC-080     # la source qui porte la décision
#    gate: ""            # l'état de la porte au passage, RECOPIÉ tel que status.mjs l'a dit :
#                          # « X condition(s) tenue(s) sur Y mesurée(s) ». Le compte se relit : Y moins X
#                          # donne les conditions non tenues, et `waived` doit en nommer exactement
#                          # autant (S124). C'était le seul champ de l'état que rien ne relisait — une
#                          # phrase libre, qu'aucun script ne pouvait contredire
#    waived: []          # conditions franchies par dérogation : - { condition: "", reason: "" }
#    kind: porte         # porte (par défaut) | retour — un retour en arrière est un passage comme un
#                        # autre, et il s'écrit dans le MÊME journal : `define_returns` ne valait que
#                        # pour le BRD, les trois autres documents reculaient sans rien écrire, et les
#                        # phases cycliques du plan ne se lisaient nulle part. Un retour porte en plus
#                        # `zone` (la zone d'ombre qui l'a provoqué) et `reason`. Sur un retour ponctuel,
#                        # `phase` ne change pas : le journal dit l'aller-retour, `phase` dit où on est.
created: "2026-11-05"    # AAAA-MM-JJ
updated: "2026-11-05"

opportunity:              # phase Assess (references/phase-assess.md)
  request:
    verbatim: "Aide d'une association de soutien scolaires dans le processeur d'inscription"   # la demande initiale, mot pour mot
    classification: "fluide"  # à faire corriger par l'utilisateur au premier échange # figee (une solution précise, qui masque souvent le problème) | fluide (une aspiration vague)
    presumed_solution: ""  # pour une demande figée : la solution présumée, à remonter au problème
  canvas:
    problems:
      - "Ressaisie annuelle : chaque année, une famille remplit les mêmes données, et autant de fois qu'elle a d'enfants (SRC-003, Dédé)"
      - "Retrait du formulaire : récupéré au bureau par un parent, ou transmis via l'enfant (SRC-003, Dédé)"
      - "Dépôt du dossier : seul un parent peut le déposer au bureau, le retour ne passe pas par l'enfant (SRC-003, Dédé)"
      - "Les dossiers papier sont détruits à chaque fin d'année : rien ne survit pour l'année suivante (SRC-003, Dédé)"
      - "Double saisie : la famille écrit ses données sur le formulaire papier, puis le bureau les retape dans un fichier Excel (SRC-008, Dédé)"
      - "Contrôle des paiements à la main : le bureau rapproche les références de virement des justificatifs avec le compte bancaire, par lots de 10 à 20 inscriptions (SRC-008, Dédé)"
      - "Le formulaire demande à la famille d'écrire le « niveau de l'année précédente » (SRC-016), que l'association détenait déjà dans le fichier de l'année passée — et c'est l'un des deux critères sur lesquels les groupes sont construits (SRC-018, Tom)"
      - "La même donnée est demandée deux fois dans un seul dossier : l'identité de l'enfant, le médical et les personnes à prévenir figurent à la fois dans le dossier et sur la fiche sanitaire, qui est à remplir une par enfant (SRC-016). La famille se recopie elle-même avant toute question d'une année sur l'autre"
      - "Ce qui survit est partiel, ce qui est complet est détruit : le fichier Excel vit plus d'un an — créé en avril 2026, effacé en juin 2027 (SRC-014, Tom) —, donc il est encore là pendant la campagne suivante, mais il n'est « qu'une aide » et ne porte pas toutes les informations de l'inscription (SRC-015, Tom), tandis que le dossier papier, qui les porte toutes, est détruit en fin d'année (SRC-003, Dédé). C'est l'écart entre les deux qui oblige une famille déjà inscrite à recommencer un formulaire vierge, et non l'effacement du fichier. Ce que le dossier papier contient de plus reste à établir (ZO-024)"
      - "Visite pour rien : si aucun membre du bureau n'est disponible, ou si une pièce manquante ne peut pas être complétée sur place, la famille repart avec son dossier et revient un autre jour (SRC-008, Dédé)"           # problèmes, ou idées de solution à ramener à un problème
    users:
      - "Les familles qui inscrivent un ou plusieurs enfants (SRC-003, Dédé)"
      - "Le bureau de l'association, qui distribue les formulaires et reçoit les dossiers (SRC-003, Dédé)"              # utilisateurs et clients visés
    solutions_today:
      - "Inscription au format papier : la famille dépose au bureau le formulaire rempli et une preuve de virement (SRC-002, Dédé)"
      - "Le dossier fait cinq pages (SRC-016) : enfant, deux représentants légaux, personnes à prévenir, renseignements médicaux, assurance, droit à l'image, choix des cours et tarifs, une fiche sanitaire par enfant, et un règlement intérieur à signer"
      - "Campagne d'inscription saisonnière : d'avril à juin (SRC-002, Dédé)"
      - "Vérification du dossier au bureau, en présence du parent, quand un membre du bureau est disponible (SRC-008, Dédé)"
      - "Fichier Excel tenu par le bureau : nom, prénom, numéros de contact, contacts d'urgence, statut de l'inscription, niveau scolaire, matières où l'enfant est inscrit (SRC-008, Dédé), et les allergies de l'enfant (SRC-009, Dédé). La liste énumérée par Dédé s'est révélée incomplète : rien ne dit qu'elle l'est encore (ZO-016)"
      - "Statut d'inscription en deux temps dans ce fichier : « pré-validé » à la saisie, « validé » une fois le virement rapproché (SRC-008, Dédé)"
      - "Le même fichier Excel sert ensuite à construire les groupes (SRC-008, Dédé)"
      - "Le fichier Excel n'est pas le registre de référence de l'inscription : il n'est « qu'une aide » et ne porte pas toutes les informations du dossier (SRC-015, Tom). Le dossier papier reste la pièce complète"
    user_value: "Ne plus remplir chaque année les mêmes données, ni les répéter pour chaque enfant — et ne plus dépendre de l'absence d'erreur au remplissage (SRC-005, Samir)"
    user_metrics:
      - "Une famille déjà connue n'a plus de formulaire à remplir à chaque campagne (SRC-006, Samir)"
      - "Le nombre d'aller-retours d'une famille pour boucler une inscription baisse (SRC-006, Samir) — entre la famille et le lieu unique où siègent le bureau et les classes (SRC-007) ; la valeur de départ reste à relever"
    adoption: ""
    business_problem: "Le bureau retape dans un fichier Excel ce que la famille vient d'écrire sur le formulaire papier, dossier par dossier, et contrôle les paiements à la main en rapprochant les références de virement des justificatifs avec le compte bancaire, par lots de 10 à 20 inscriptions. Un dossier qu'on ne peut pas compléter sur place, ou une arrivée au moment où aucun membre du bureau n'est disponible, fait repartir la famille et recommencer la visite — donc le contrôle aussi. Cette charge tient sur les membres du bureau et se concentre sur la campagne d'avril à juin (SRC-008, Dédé)."
    business_metrics:
      - "Temps de saisie des dossiers dans le fichier Excel sur une campagne : valeur de départ 5 à 10 minutes par dossier pour 150 dossiers (SRC-011, Dédé), soit 12 h 30 à 25 h par campagne — arithmétique déduite des deux chiffres, à confirmer. Reste à établir si « 150 dossiers » compte des enfants ou des familles (ZO-019), et qui porte cette charge (ZO-018)"
      - "Moins d'aller-retours des parents sur la campagne d'avril à juin (SRC-010, Dédé) — lu du côté du bureau, un aller-retour évité est une vérification de dossier au comptoir qui ne se refait pas. C'est l'indicateur de Samir vu de l'autre bord, pas une mesure propre au bureau : la valeur de départ reste à relever, et ni la saisie dans l'Excel ni le rapprochement bancaire ne bougent avec lui (ZO-017)"
    budget: "Des mois (SRC-012, Dédé). Reste à établir si ce sont des mois de calendrier, sur lesquels l'association accepte que la démarche s'étale, ou du temps de travail cumulé qu'elle accepte d'y mettre — sur des bénévoles les deux ne se valent pas (ZO-020)."             # ordre de grandeur : jours, semaines, mois
  decision: aller_plus_loin     # en_attente | aller_plus_loin | jeter | decoupee | a_apprendre | reportee
  reason: "La cause de la ressaisie est établie et elle est structurelle, pas réglementaire : ce qui survit à la campagne est partiel — le fichier Excel, huit informations, qui vit d'avril 2026 à juin 2027 — et ce qui est complet est détruit — le dossier papier, cinq pages. Les deux côtés sont chiffrés : 12 h 30 à 25 h de saisie par campagne pour le bureau, et pour chaque famille cinq pages réécrites chaque année, avec une fiche sanitaire de plus par enfant. La donnée qui justifie de tout détruire — le médical — est portée par une pièce distincte du dossier, qui sert les soins et l'urgence en séance et non l'acte d'inscription : la séparation à vérifier est étroite et visible dans le formulaire de l'association. Face à un budget en mois, une découverte est peu coûteuse. Ce qui plaide contre et qui est assumé : aucun utilisateur direct n'a parlé en son nom, et il n'est pas établi qu'un texte impose la destruction — ce sont les deux premières choses que la découverte doit traiter."
  to_learn: []             # si a_apprendre : - { question: "", who: "" }
  split_into: []           # si decoupee : slugs des initiatives filles. Sans eux, « close » se relit
                           # comme un abandon — ce qui est arrivé, avec la vérité en commentaire YAML
  decided_by: SH-02        # déclaré par l'utilisateur
  date: "2026-11-05"

problem:
  statement: "Chaque année, d'avril à juin, une famille qui réinscrit ses enfants remplit intégralement un dossier papier de cinq pages, avec une fiche sanitaire de plus par enfant, alors que l'association détient encore à ce moment-là le fichier de l'année précédente. Mais ce fichier n'est qu'une aide — huit informations — tandis que la pièce complète, le dossier papier, est détruite en fin d'année : ce qui survit ne dispense donc de presque rien. Le bureau retape ensuite chaque dossier dans ce fichier, 5 à 10 minutes pièce pour 150 dossiers, puis rapproche les virements au compte bancaire à la main, par lots de 10 à 20 inscriptions."
  confirmed: true
  symptoms:
    - { text: "Une famille réécrit chaque année les mêmes données, et autant de fois qu'elle a d'enfants", source: SRC-003 }
    - { text: "La même donnée est demandée deux fois à l'intérieur d'un seul dossier : identité de l'enfant, renseignements médicaux et personnes à prévenir figurent dans le corps du dossier et sur la fiche sanitaire", source: SRC-016 }
    - { text: "Le formulaire redemande à la famille le niveau de l'année précédente, que l'association détenait déjà dans son fichier", source: SRC-016 }
    - { text: "Une famille repart avec son dossier et revient un autre jour quand une pièce manque et ne peut pas être complétée sur place, ou qu'aucun membre du bureau n'est disponible", source: SRC-008 }
    - { text: "Une inscription reste « pré-validée » jusqu'au prochain lot de rapprochement bancaire, soit toutes les 10 à 20 inscriptions", source: SRC-008 }
  impact:
    - { type: temps, text: "12 h 30 à 25 h de saisie par campagne pour le bureau, sur des bénévoles : 5 à 10 minutes par dossier, 150 dossiers", source: SRC-011 }
    - { type: temps, text: "Cinq pages réécrites par famille à chaque campagne, plus une fiche sanitaire par enfant", source: SRC-016 }
    - { type: qualite, text: "Le groupe d'un enfant dépend du niveau scolaire recopié par un parent sur le formulaire, sans vérification par les professeurs", source: SRC-019 }
    - { type: risque, text: "Des dossiers papier portant des données médicales, une situation familiale et un éventuel jugement de séparation sont conservés pendant la campagne dans un bureau partagé avec d'autres associations", source: SRC-016 }

success_signals:         # repris du canevas d'opportunité : rien de neuf n'est affirmé ici
  - { text: "Une famille déjà connue de l'association n'a plus de dossier complet à remplir à chaque campagne", measurable: true, source: SRC-006 }
  - { text: "Le nombre d'aller-retours d'une famille pour boucler une inscription baisse, entre elle et le lieu unique où siègent le bureau et les classes", measurable: true, source: SRC-006 }
  - { text: "Le temps que le bureau passe à saisir les dossiers sur une campagne baisse, depuis une valeur de départ de 12 h 30 à 25 h", measurable: true, source: SRC-011 }
#  - { text: "", measurable: false }

scope:
  in:
    - { text: "Le parcours d'inscription d'une famille, du retrait du formulaire jusqu'à l'inscription passée en « validé » après rapprochement du virement", reason: "C'est le périmètre que la décision de DD-01 laisse à l'initiative, en sortant ce qui vient après." }
  out:
    - { text: "La construction des groupes à partir du fichier d'inscriptions", reason: "Décision DD-01 du 2026-11-05, rendue par Dédé : hors périmètre pour l'instant. Du côté des données, l'étape est déjà servie — le tri se fait sur la matière et le niveau scolaire, deux colonnes que le fichier porte. Ce que le tri a de difficile n'est pas connu, et ça ne se découvre pas dans cette initiative. Ce qui en est su reste écrit (RG-001, ZO-027, ZO-028) et peut devenir une opportunité à part." }
  deadline: ""

current_process:         # reconstitué en Discover (atelier, entretiens). MÊME FORME que target_process :
  events: []             # le processus actuel et le processus cible se lisent côte à côte
#    - { event: "Dossier reçu", actor: "", source: SRC-xxx }

constraints:
  - type: legale
    text: "Le dossier porte des données sensibles qui ne sont pas médicales : situation familiale des parents, jugement de séparation ou attestation de résidence alternée, profession"
    source: SRC-016
    implication: "La destruction annuelle est motivée par le médical, mais ces données-là posent la même question de conservation et d'accès, d'autant que les dossiers sont gardés dans un local partagé avec d'autres associations."
  - type: organisationnelle
    text: "Le dossier est signé à la main en plusieurs endroits : autorisation de diffusion d'image, autorisation de soins médicaux, tarifs et modes de paiement, règlement intérieur"
    source: SRC-016
    implication: "Fait à enregistrer, pas encore une contrainte sur une cible : ce que chaque signature engage et ce qui la rend nécessaire restent à établir."
  - type: legale
    text: "Le dossier d'inscription contient des données médicales"
    source: SRC-004
    implication: "Données de santé : leur conservation d'une année sur l'autre, sa base et sa durée, sont à établir avant toute cible. Il n'est pas encore établi que la destruction annuelle soit imposée par un texte (ZO-008) ni quelles données sont concernées (ZO-007)."          # - { type: legale|contractuelle|organisationnelle|budgetaire|environnement|autre:<libellé>, text: "", source: SRC-xxx, implication: "" }
                          #   environnement : conditions réelles d'usage (bruit, lumière, mains occupées ou gantées, déplacement, connexion, interruptions, temps disponible)

