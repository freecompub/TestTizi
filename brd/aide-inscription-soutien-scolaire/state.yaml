    question: "La construction des groupes entre-t-elle dans le périmètre de cette initiative, ou s'arrête-t-on à l'inscription validée ?"
    zone: ZO-015
    options:
      - { text: "Hors périmètre pour l'instant", impacts: "Les professeurs ne sont pas entendus sur ce que le tri a de difficile, et un besoin de leur côté pourrait rester invisible. En contrepartie la phase reste courte et le fichier sert déjà le tri tel qu'il est décrit." }
      - { text: "Dedans", impacts: "Il faut comprendre qui construit les groupes, avec quoi, en combien de temps et sous quelles contraintes, et entendre les professeurs. La découverte s'allonge d'autant, pour un gain non établi." }
      - { text: "Décider plus tard", impacts: "Le périmètre se figerait à la fin de la phase sans que la question ait été posée." }
    decision: "Hors périmètre pour l'instant"
    rationale: "Du côté des données, l'étape est déjà servie : le tri porte sur la matière et le niveau scolaire, deux colonnes du fichier. Ce que le tri a de difficile reste inconnu, mais ne justifie pas d'élargir maintenant."
    decided_by: SH-02
    date: "2026-11-05"
    status: validé
