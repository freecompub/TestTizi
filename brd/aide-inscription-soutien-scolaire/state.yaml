hypotheses:
  - id: H-001
    text: "Les données d'une inscription peuvent être conservées d'une année sur l'autre"
    basis: "Les dossiers PAPIER sont détruits en fin d'année parce qu'ils contiennent des données médicales (SRC-004), et le fichier Excel est effacé pour la même raison (SRC-009). Mais ce fichier vit d'avril 2026 à juin 2027 (SRC-014), donc un SOUS-ENSEMBLE des données d'inscription est déjà conservé plus d'un an, et il est encore là pendant la campagne suivante. Pour ce sous-ensemble, l'hypothèse est tranchée par la pratique. Elle reste entière pour le reste du dossier — le fichier n'est qu'une aide et ne porte pas tout (SRC-015) —, et c'est ce reste qui est réécrit chaque année"
    verification: "Établir d'abord ce que le dossier papier porte que le fichier ne porte pas (ZO-024) : c'est sur ce reste que l'hypothèse se joue, le sous-ensemble du fichier étant déjà conservé en pratique. Puis, pour ce reste, récupérer le texte ou la consigne invoquée s'il y en a un (ZO-008) et établir le régime de conservation applicable aux données de santé"
    status: à vérifier
  - id: H-002
    text: "Les données administratives du dossier (identité, coordonnées, famille) peuvent être conservées d'une année sur l'autre indépendamment des données médicales"
    basis: "La destruction est motivée par les seules données médicales (SRC-004) : rien n'a été dit du reste du dossier. Dans le fichier Excel, la seule donnée médicale nommée à ce jour est une colonne — les allergies de l'enfant (SRC-009) —, et c'est elle qui fait effacer tout le fichier, coordonnées et niveau scolaire compris. Une seule donnée nommée est plus étroite à isoler qu'une catégorie entière ; cela ne dit pas qu'elle est la seule (ZO-016). À noter : l'énumération précédente avait fait conclure à tort que la séparation existait déjà (SRC-008 corrigée par SRC-009) — en pratique les deux cohabitent"
    verification: "ZO-007 est levée par le dossier lui-même : le médical y est porté par une pièce distincte, la fiche sanitaire, qui sert l'urgence et les soins en séance et non l'acte d'inscription. Reste à établir pourquoi le médical figure AUSSI dans le corps du dossier en page 2, et la liste réelle des colonnes du fichier Excel (ZO-016). L'hypothèse se joue désormais sur ce doublon, pas sur la séparation elle-même"
    status: à vérifier
