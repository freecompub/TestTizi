sources:
  - id: SRC-001
    type: cadrage
    date: "2026-11-05"
    stakeholders: []
    present: [SH-01, SH-02, SH-03]
    quote: "C'est Samir représentant des parents d'élèves, Dédé directeur de l'association et représentant des membres des bureaux, tom représente des professeurs et membres du bureau. Il a également toto qui est enseignants et qui n'est pas présent et qui est contactable par mail <coordonnée hors dépôt : contacts.yaml>"
    understood: "Tour de table de l'échange d'ouverture : trois personnes présentes (Samir, Dédé, Tom) et un enseignant absent (Toto). La voix qui a répondu n'est pas établie — le tour de table parle des trois présents à la troisième personne —, donc aucune partie prenante n'est enregistrée comme locutrice."
    feedback: à envoyer
  - id: SRC-002
    type: cadrage
    date: "2026-11-05"
    stakeholders: [SH-02]
    present: [SH-01, SH-02, SH-03]
    quote: "Les inscriptions se font du mois d'avril au mois de juin, les inscriptions se font au format papier\nIl doivent déposer le formulaire plus une preuve de virement au bureau"
    understood: "Processus actuel d'inscription, tel que le décrit Dédé : une campagne d'avril à juin, un dossier papier, et un dépôt physique au bureau de deux pièces — le formulaire rempli et une preuve de virement. Ce qui coince n'est pas encore dit : la question portait aussi là-dessus et n'a pas été reprise."
    feedback: à envoyer
  - id: SRC-003
    type: cadrage
    date: "2026-11-05"
    stakeholders: [SH-02]
    present: [SH-01, SH-02, SH-03]
    quote: "Il y a deux problèmes 1 + c'est le format papier, les familles sont obligés de remplir chaque année les mêmes données multiplié par le nombre d'enfants. 2 les formulaires sont soit récupérer par les parents au bureau soit transmis via les enfants. 3- les parents sont obligés de déposer les formulaires aux bureaux et pas via les enfants. 4- les dossiers papier sont détruits a chaque fin d'année"
    understood: "Dédé nomme quatre points : la ressaisie annuelle des mêmes données, multipliée par le nombre d'enfants ; la distribution du formulaire, au bureau ou via l'enfant ; le dépôt, réservé au parent et au bureau ; la destruction des dossiers en fin d'année. Le premier est énoncé comme « le format papier » — c'est le support mis en cause, pas encore le problème : ce qui coûte est la ressaisie, que la destruction des dossiers rend inévitable. La raison de cette destruction n'est pas dite."
    feedback: à envoyer
  - id: SRC-004
    type: cadrage
    date: "2026-11-05"
    stakeholders: [SH-02]
    present: [SH-01, SH-02, SH-03]
    quote: "Il contient des données médicales"
    understood: "La destruction des dossiers en fin d'année est motivée par la présence de données médicales dans le dossier d'inscription. Deux choses restent non dites : quelles données médicales, et pour quel usage dans l'inscription ; et si la destruction est imposée par un texte ou décidée par l'association."
    feedback: à envoyer
  - id: SRC-005
    type: cadrage
    date: "2026-11-05"
    stakeholders: [SH-01]
    present: [SH-01, SH-02, SH-03]
    quote: "Ne plus remplir les mêmes données chaque année en plus on le fait plusieurs fois si on a plusieurs enfants et ça si on se trompent pas pandent le remplissage du formulaire"
    understood: "Samir confirme, côté familles, la ressaisie annuelle et sa répétition par enfant — deuxième voix sur ce besoin, après Dédé. Il ajoute un élément que personne n'avait dit : le remplissage suppose de ne pas se tromper, donc l'erreur a un coût qui n'est pas encore décrit. Il répond en « on », ce qui le place comme parent lui-même, et pas seulement comme représentant : à faire corriger."
    confirms: [BC-001]
    feedback: à envoyer
  - id: SRC-006
    type: cadrage
    date: "2026-11-05"
    stakeholders: [SH-01]
    present: [SH-01, SH-02, SH-03]
    quote: "Plus de formulaire a remplir chaque année, réduire le nombre d'aller retour avec l'école"
    understood: "Deux signaux observables proposés par Samir côté familles : plus aucun formulaire à remplir d'une année sur l'autre, et moins d'aller-retours. Il nomme « l'école » comme l'autre bout de ces aller-retours, là où Dédé décrivait un dépôt « au bureau » : les deux mots désignent peut-être le même lieu, peut-être deux, et la question reste ouverte. Aucune valeur de départ n'est connue pour l'instant."
    feedback: à envoyer
