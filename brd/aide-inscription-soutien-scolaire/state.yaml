    ask_to: SH-02
    action: entretien
    blocking: false
    posee: [{ date: "2026-11-05", canal: "vive voix" }]
    status: levée
    resolution: "Le dossier contient des données médicales (SRC-004, Dédé) : c'est ce qui motive sa destruction en fin d'année."
    related: [H-001, BC-001, BC-003, SRC-004]
  - id: ZO-006
    type: attendu_implicite
    question: "Pourquoi le dossier rempli ne peut-il pas revenir par l'enfant, alors que le formulaire vierge peut partir par lui ?"
    origin: SRC-003
    ask_to: SH-02
    action: entretien
    blocking: false
    posee: []
    status: ouverte
    related: [BC-002]
  - id: ZO-007
    type: attendu_implicite
