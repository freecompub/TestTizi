    lint_waivers: [{ rule: S89, reason: "Personne n'existe au-dessus du directeur dans l'association (SRC-023) : il n'y a aucun sponsor distinct du décideur pour confirmer l'attribution. Elle est donc laissée sans confirmation plutôt que confirmée par son propre titulaire, ce que le dossier refuse à juste titre. La conséquence est portée par le risque R-02." }]
#                        # qui tranche quoi, établi au cadrage et validé par le sponsor
#  - domain: perimetre     # perimetre | objectifs | priorites | donnees_securite | processus:<nom> | regles:<domaine> | autre:<libellé>
#    decider: SH-01
#    escalation: SH-00     # recours si le décideur ne tranche pas ; le sponsor en dernier ressort
#    confirmed_by: SH-00   # qui a confirmé cette attribution
#    source: SRC-xxx

sources:
  - id: SRC-001
    type: cadrage
    date: "2026-11-05"
    stakeholders: []
    present: [SH-01, SH-02, SH-03]
    quote: "C'est Samir représentant des parents d'élèves, Dédé directeur de l'association et représentant des membres des bureaux, tom représente des professeurs et membres du bureau. Il a également toto qui est enseignants et qui n'est pas présent et qui est contactable par mail <coordonnée hors dépôt : contacts.yaml>"
    understood: "Tour de table de l'échange d'ouverture : trois personnes présentes (Samir, Dédé, Tom) et un enseignant absent (Toto). La voix qui a répondu n'est pas établie — le tour de table parle des trois présents à la troisième personne —, donc aucune partie prenante n'est enregistrée comme locutrice."
    feedback: à envoyer
  - id: SRC-002
    type: cadrage
    date: "2026-11-05"
    stakeholders: [SH-02]
    present: [SH-01, SH-02, SH-03]
    quote: "Les inscriptions se font du mois d'avril au mois de juin, les inscriptions se font au format papier\nIl doivent déposer le formulaire plus une preuve de virement au bureau"
    understood: "Processus actuel d'inscription, tel que le décrit Dédé : une campagne d'avril à juin, un dossier papier, et un dépôt physique au bureau de deux pièces — le formulaire rempli et une preuve de virement. Ce qui coince n'est pas encore dit : la question portait aussi là-dessus et n'a pas été reprise."
    feedback: à envoyer
  - id: SRC-003
    type: cadrage
    date: "2026-11-05"
    stakeholders: [SH-02]
    present: [SH-01, SH-02, SH-03]
    quote: "Il y a deux problèmes 1 + c'est le format papier, les familles sont obligés de remplir chaque année les mêmes données multiplié par le nombre d'enfants. 2 les formulaires sont soit récupérer par les parents au bureau soit transmis via les enfants. 3- les parents sont obligés de déposer les formulaires aux bureaux et pas via les enfants. 4- les dossiers papier sont détruits a chaque fin d'année"
    understood: "Dédé nomme quatre points : la ressaisie annuelle des mêmes données, multipliée par le nombre d'enfants ; la distribution du formulaire, au bureau ou via l'enfant ; le dépôt, réservé au parent et au bureau ; la destruction des dossiers en fin d'année. Le premier est énoncé comme « le format papier » — c'est le support mis en cause, pas encore le problème : ce qui coûte est la ressaisie, que la destruction des dossiers rend inévitable. La raison de cette destruction n'est pas dite."
    feedback: à envoyer
  - id: SRC-004
    type: cadrage
    date: "2026-11-05"
    stakeholders: [SH-02]
    present: [SH-01, SH-02, SH-03]
    quote: "Il contient des données médicales"
    understood: "La destruction des dossiers en fin d'année est motivée par la présence de données médicales dans le dossier d'inscription. Deux choses restent non dites : quelles données médicales, et pour quel usage dans l'inscription ; et si la destruction est imposée par un texte ou décidée par l'association."
    feedback: à envoyer
  - id: SRC-005
    type: cadrage
    date: "2026-11-05"
    stakeholders: [SH-01]
    present: [SH-01, SH-02, SH-03]
    quote: "Ne plus remplir les mêmes données chaque année en plus on le fait plusieurs fois si on a plusieurs enfants et ça si on se trompent pas pandent le remplissage du formulaire"
    understood: "Samir confirme, côté familles, la ressaisie annuelle et sa répétition par enfant — deuxième voix sur ce besoin, après Dédé. Il ajoute un élément que personne n'avait dit : le remplissage suppose de ne pas se tromper, donc l'erreur a un coût qui n'est pas encore décrit. Il répond en « on », ce qui le place comme parent lui-même, et pas seulement comme représentant : à faire corriger."
    confirms: [BC-001]
    feedback: à envoyer
  - id: SRC-006
    type: cadrage
    date: "2026-11-05"
    stakeholders: [SH-01]
    present: [SH-01, SH-02, SH-03]
    quote: "Plus de formulaire a remplir chaque année, réduire le nombre d'aller retour avec l'école"
    understood: "Deux signaux observables proposés par Samir côté familles : plus aucun formulaire à remplir d'une année sur l'autre, et moins d'aller-retours. Il nomme « l'école » comme l'autre bout de ces aller-retours, là où Dédé décrivait un dépôt « au bureau » : les deux mots désignent peut-être le même lieu, peut-être deux, et la question reste ouverte. Aucune valeur de départ n'est connue pour l'instant."
    feedback: à envoyer
  - id: SRC-007
    type: cadrage
    date: "2026-11-05"
    stakeholders: [SH-02]
    present: [SH-01, SH-02, SH-03]
    quote: "Le bureau de l'association qui est le même endroit où se trouve les classes, c'est un espace partage avec d'autres associations"
    understood: "Dédé établit qu'il n'y a qu'un seul lieu : le bureau de l'association est au même endroit que les classes. « Le bureau » et « l'école », dont Dédé et Samir parlaient séparément, désignent donc le même endroit, et les aller-retours d'une famille se font entre elle et ce lieu unique. Fait nouveau, que personne n'avait dit : ce lieu est un espace partagé avec d'autres associations. Ce que ce partage implique pour des dossiers papier contenant des données médicales — où ils sont conservés pendant la campagne, qui y a accès — n'est pas encore dit."
    feedback: à envoyer
  - id: SRC-023
    type: entretien
    date: "2026-11-05"
    stakeholders: [SH-02]
    quote: "Non"
    understood: "Il n'y a personne au-dessus du directeur dans l'association : ni président, ni instance qui le mandate. C'est donc lui qui décide, arbitre et approuvera, sans contre-signature possible. Aucun sponsor distinct du décideur n'existe, et l'attribution des droits de décision restera sans confirmation. Le seul contrôle disponible sur le contenu du dossier devient la relecture par ceux qui y sont cités."
    feedback: à envoyer
  - id: SRC-022
    type: décision
    date: "2026-11-05"
    stakeholders: [SH-02]
    quote: "Arbitrage : Dédé tranche le périmètre, les objectifs et les priorités, sans recours au-dessus."
    understood: "Les droits de décision sont établis avant le premier désaccord, ce qui est le seul moment où ils peuvent l'être sans choisir un camp. Dédé, directeur de l'association, tranche le périmètre, les objectifs et les priorités, sans recours nommé au-dessus de lui. L'attribution reste à confirmer : elle ne peut pas l'être par son propre titulaire, et aucune personne au-dessus du directeur n'a été nommée à ce jour."
    feedback: sans objet
    feedback_motif: "C'est une décision de l'utilisateur, pas un recueil auprès de quelqu'un."
  - id: SRC-021
    type: décision
    date: "2026-11-05"
    stakeholders: [SH-02]
    quote: "Périmètre : la construction des groupes est hors périmètre pour l'instant ; l'initiative s'arrête à l'inscription validée."
    understood: "Dédé tranche le périmètre. L'initiative couvre le parcours d'inscription jusqu'au passage en « validé » après rapprochement du virement, et pas ce qui vient après. Deux zones d'ombre sortent avec cette décision et sont assumées."
    feedback: sans objet
    feedback_motif: "C'est une décision de l'utilisateur, pas un recueil auprès de quelqu'un."
  - id: SRC-020
    type: décision
    date: "2026-11-05"
    stakeholders: [SH-02]
    quote: "Formulation du problème soumise en trois affirmations et confirmée telle quelle : « c'est juste »."
    understood: "Le problème est confirmé dans sa formulation. Il devient la base à laquelle les objectifs métier et les exigences se rattacheront."
    confirms: []
    feedback: sans objet
    feedback_motif: "C'est une décision de l'utilisateur, pas un recueil auprès de quelqu'un."
  - id: SRC-019
    type: entretien
    date: "2026-11-05"
    stakeholders: [SH-03]
    quote: "Du formulaire c'est le niveau scolaire"
    understood: "Le niveau sur lequel les groupes sont triés vient du formulaire rempli par la famille, et c'est le niveau scolaire de l'enfant — sa classe —, pas un niveau pédagogique évalué par les professeurs. Deux conséquences. Le groupe d'un enfant dépend donc de ce qu'un parent a recopié, ce qui donne une portée concrète à la remarque de Samir sur le coût d'une erreur de remplissage. Et les professeurs n'apportent aucune appréciation au fichier : ce qu'ils perdraient à son effacement en est d'autant plus réduit. Un point reste à éclaircir : le formulaire demande le « niveau de l'année précédente » et la fiche sanitaire une « classe », alors que les groupes se construisent pour l'année à venir."
    feedback: à envoyer
  - id: SRC-018
    type: entretien
    date: "2026-11-05"
    stakeholders: [SH-03]
    quote: "On tri les élèves par Matière et par niveau scolaire"
    understood: "La construction des groupes est un tri des élèves sur deux critères : la matière et le niveau scolaire. Ce sont exactement deux des colonnes du fichier, donc le fichier suffit à cette étape telle qu'elle est décrite. La réponse est courte et ne dit pas qui fait ce tri, avec quoi, combien de temps il prend, ni ce qui le rend difficile — un effectif de groupe, une disponibilité d'enseignant, un emploi du temps. Elle ne dit pas non plus ce que l'effacement du fichier coûte aux professeurs, qui était la seconde moitié de la question. À rapprocher du formulaire : il demande à la famille d'écrire le « niveau de l'année précédente », une information que l'association détenait déjà dans le fichier de l'année passée."
    feedback: à envoyer
  - id: SRC-017
    type: décision
    date: "2026-11-05"
    stakeholders: [SH-02]
    quote: "Décision d'opportunité : aller plus loin. Rendue par Dédé, directeur de l'association."
    understood: "Dédé rend la décision d'opportunité et choisit d'aller plus loin. La phase de cadrage se clôt sur cette décision et la découverte s'ouvre. Ce n'est pas un engagement à construire : c'est l'accord pour investir dans la compréhension du problème."
    feedback: sans objet
    feedback_motif: "C'est une décision de l'utilisateur, pas un recueil auprès de quelqu'un : il n'y a rien à lui faire relire."
  - id: SRC-016
    type: document
    date: "2026-11-05"
    path: "brd/aide-inscription-soutien-scolaire/sources/SRC-016-dossier-inscription-2026-2027.pdf"
    understood: "Le dossier d'inscription 2026-2027 de l'Institut ESC (1 rue Pierre Bayle, 62300 Lens), 5 pages, fourni comme modèle. Page 1, enfant à inscrire : nom, prénom, date de naissance, sexe, lieu et département de naissance, adresse, code postal, ville, niveau de l'année précédente, et une photo. Puis les deux représentants légaux, en vis-à-vis : nom et prénom, nom d'usage, adresse, code postal, ville, téléphone domicile, portable, courriel, profession, situation familiale, et en cas de séparation la résidence de l'enfant avec copie du jugement ou attestation signée des deux parents. Page 2 : deux personnes à prévenir en cas d'urgence (nom, prénom, lien, deux téléphones) ; renseignements médicaux (médecin traitant et son téléphone, vaccins obligatoires et date du dernier rappel, projet d'accueil individualisé, allergies alimentaires, asthme, allergies médicamenteuses) ; assurance (responsabilité civile, individuelle accident, compagnie, numéro de police) ; autorisation de photographier et de diffuser l'image de l'enfant ; choix des cours — deux cours de quatre heures, ou un cours de deux heures en arabe ou en éducation islamique — avec les tarifs par nombre d'enfants, et le mode de paiement. Pages 3 et 4, une fiche sanitaire par enfant : identité de nouveau, maladies déjà contractées, allergies et projet d'accueil, asthme, allergies médicamenteuses, port de lunettes, médecin traitant de nouveau, autorisation de soins, puis trois personnes à prévenir avec leur lien de parenté et le droit de venir chercher l'enfant. Page 5, le règlement intérieur en sept articles, à signer. Trois constats. D'abord l'écart avec le fichier est quasiment tout le dossier : le fichier porte huit informations, le dossier en porte plusieurs dizaines sur cinq pages. Ensuite la même donnée est demandée DEUX FOIS à l'intérieur d'un seul dossier — l'identité de l'enfant en page 1 et sur la fiche sanitaire, le médical en page 2 et sur la fiche sanitaire, les personnes à prévenir en page 2 et sur la fiche sanitaire — donc une famille se recopie déjà elle-même avant toute question d'une année sur l'autre. Enfin le dossier porte des signatures manuscrites en plusieurs endroits, et des données sensibles qui ne sont pas médicales : situation familiale, jugement de séparation, profession des parents. À noter que le fond de page est le formulaire 2025/2026, sur lequel l'année 2026-2027 et le paiement par virement sont imprimés par-dessus."
    feedback: sans objet
  - id: SRC-015
    type: cadrage
    date: "2026-11-05"
    stakeholders: [SH-03]
    present: [SH-01, SH-02, SH-03]
    quote: "Le fichier n'ai qu'une aide il ne contient pas toutes les informations"
    understood: "Tom donne la cause de la ressaisie annuelle. Le fichier Excel n'est pas le registre de référence de l'inscription : c'est un outil de travail partiel, qui ne porte pas toutes les informations du dossier. La pièce complète est le dossier papier, et c'est elle qui est détruite en fin d'année. Donc ce qui survit à la campagne est incomplet, et ce qui est complet ne survit pas : une famille qui revient doit tout réécrire parce que ce que l'association a gardé ne suffit pas à la dispenser de le faire. Ce n'est pas l'effacement du fichier qui cause la ressaisie, c'est l'écart entre le fichier et le dossier. La taille de cet écart — ce que le dossier papier porte que le fichier ne porte pas — n'est pas encore connue, et c'est elle qui mesure le travail réellement en jeu."
    feedback: à envoyer
  - id: SRC-014
    type: cadrage
    date: "2026-11-05"
    stakeholders: [SH-03]
    present: [SH-01, SH-02, SH-03]
    quote: "Je te donne un exemple le fichier est créé en avril 2026 et sera effacer au Moi de juin 2027"
    understood: "Première parole de Tom dans le dossier. Le fichier d'inscriptions ne vit pas une campagne mais plus d'un an : créé en avril 2026 au début de la campagne, effacé en juin 2027. Il couvre donc l'année scolaire qu'il sert, et il est toujours en place pendant la campagne suivante d'avril à juin 2027. Conséquence, et c'est une lecture à faire corriger : au moment où une famille déjà inscrite revient s'inscrire, l'association détient encore ses données de l'année précédente — et la famille recommence pourtant un formulaire vierge. L'effacement n'est donc pas la cause de la ressaisie annuelle, contrairement à ce qui avait été conclu plus tôt ; sa cause réelle n'est pas connue. À noter que la question posée portait sur la construction des groupes : elle n'a pas été répondue et reste à reprendre."
    corrects: [SRC-009]
    feedback: à envoyer
  - id: SRC-013
    type: cadrage
    date: "2026-11-05"
    stakeholders: [SH-02]
    present: [SH-01, SH-02, SH-03]
    quote: "T'as posé aucun questions Samir est le représentant des parents, tom et toto sont les représentants des prof,"
    understood: "Deux choses. Un reproche d'abord, et il est fondé : les questions de la phase sont allées à Dédé, et les représentants présents n'ont rien été demandés — Tom n'a été interrogé sur rien depuis l'ouverture du dossier. Une correction ensuite : Samir représente les parents, et les professeurs ont deux représentants, Tom et Toto, et non un seul. Toto n'est donc pas représenté par Tom : ils portent la même fonction, et le lien de représentation qui allait de l'un à l'autre est retiré. La qualité de représentant de Toto est déclarée par quelqu'un d'autre que lui, et il n'a toujours pas parlé : ce qu'un tiers dit de son mandat ne le mandate pas, donc rien n'est inscrit comme mandat tant qu'il ne l'a pas dit lui-même. Reste ouvert de savoir si Tom est lui-même professeur : s'il l'est, sa parole sera celle d'un utilisateur direct et non seulement d'un porte-parole."
    feedback: à envoyer
  - id: SRC-012
    type: cadrage
    date: "2026-11-05"
    stakeholders: [SH-02]
    present: [SH-01, SH-02, SH-03]
    quote: "En mois"
    understood: "Interrogé sur l'ordre de grandeur que l'association est prête à investir dans la démarche — jours, semaines ou mois —, Dédé répond : des mois. C'est la dernière case du canevas d'opportunité, et elle est donc remplie. Ce que « des mois » recouvre reste à préciser : une durée de calendrier sur laquelle la démarche peut s'étaler, ou du temps de travail cumulé que l'association accepte d'y consacrer. Sur une équipe de bénévoles les deux ne se valent pas, et c'est le second qui se compare aux heures de saisie mesurées juste avant."
    feedback: à envoyer
  - id: SRC-011
    type: cadrage
    date: "2026-11-05"
    stakeholders: [SH-02]
    present: [SH-01, SH-02, SH-03]
    quote: "Entre 5 a 10mn par dossier sur 150 dossier"
    understood: "La saisie d'un dossier dans le fichier Excel prend 5 à 10 minutes, et la campagne compte 150 dossiers. L'arithmétique de ces deux chiffres donne 12 h 30 à 25 h de saisie par campagne, concentrées sur avril-juin — c'est une déduction, pas une parole de Dédé, et elle est à confirmer. C'est le premier chiffre du dossier, et il mesure une frappe de données que la famille vient d'écrire à la main. Deux choses restent à établir : si « 150 dossiers » compte des enfants ou des familles, puisqu'une famille remplit un formulaire par enfant ; et qui, au bureau, porte ces heures."
    feedback: à envoyer
  - id: SRC-010
    type: cadrage
    date: "2026-11-05"
    stakeholders: [SH-02]
    present: [SH-01, SH-02, SH-03]
    quote: "Mois d'aller retour des parents entre avril et juin"
    understood: "Interrogé sur ce qui changerait dans les chiffres du bureau, Dédé nomme la baisse des aller-retours des parents pendant la campagne d'avril à juin — « mois » est lu comme « moins », à corriger si c'est autre chose. Côté bureau, un aller-retour évité est une vérification de dossier au comptoir qui ne se refait pas, donc la mesure vaut des deux côtés. Mais c'est la même que celle déjà donnée par le représentant des parents : le bureau n'a pas encore nommé de gain qui lui soit propre, et les deux charges qu'il a lui-même décrites — retaper chaque dossier dans le fichier Excel, rapprocher les virements par lots — ne bougent pas avec le nombre d'aller-retours."
    feedback: à envoyer
  - id: SRC-009
    type: cadrage
    date: "2026-11-05"
    stakeholders: [SH-02]
    present: [SH-01, SH-02, SH-03]
    quote: "Il est effacé il contient une données médicales. Les alergie de l'enfant"
    understood: "Le fichier Excel est effacé en fin d'année, pour la même raison que les dossiers papier : il contient une donnée médicale, les allergies de l'enfant. Donc rien ne survit d'une campagne à l'autre, sur aucun support. Et la liste de colonnes donnée juste avant n'était pas complète : les allergies n'y figuraient pas, ce qui interdit de tenir cette liste pour exhaustive. La séparation entre l'administratif et le médical, que l'énumération précédente laissait croire déjà en place, n'existe pas : les deux cohabitent dans le même fichier, et c'est cette cohabitation qui fait effacer le tout. Ce qui reste à établir est si les allergies sont la seule donnée médicale du fichier, et si cet effacement est imposé par un texte ou s'il est la prudence de l'association."
    corrects: [SRC-008]
    feedback: à envoyer
  - id: SRC-008
    type: cadrage
    date: "2026-11-05"
    stakeholders: [SH-02]
    present: [SH-01, SH-02, SH-03]
    quote: "Les familles viennent pour déposer le dossier, si les mombre du bureau sont disponibles ils vérifient le dossier en présence du parent, s'il manque quelques choses est le parent peut le compléter directement, le dossier est près validé, on le saisir dans un fichier excel avec le statut près validé, si le complément n'est pas possible le parent repart avec le dossier et reviens un autre jour. Lorsque on a cumulé plusieurs inscriptions 10-20, on fait le rapprochement entre les références de virement sur les justificatifs et le compte bancaire. Pour les virements validé passe a validé. Le fichier excel quantien que le non, prénom, les numéro de contact, les contacts d'urgence et le statut de l'inscription, le niveau scolaire, les matières dans les quel l'enfant est inscrit. Ce même fichier nous servira plus tard a la construction des groupes"
    understood: "Dédé décrit ce que fait le bureau pendant la campagne. Dépôt au bureau ; vérification du dossier en présence du parent, à condition qu'un membre du bureau soit disponible ; si une pièce manque et peut être complétée sur place, le dossier devient « pré-validé » et est saisi dans un fichier Excel avec ce statut ; sinon la famille repart avec son dossier et revient un autre jour. Par lots de 10 à 20 inscriptions, le bureau rapproche les références de virement portées sur les justificatifs avec le compte bancaire, et les virements retrouvés font passer l'inscription à « validé ». Le fichier Excel porte nom, prénom, numéros de contact, contacts d'urgence, statut de l'inscription, niveau scolaire et matières, et il sert ensuite à construire les groupes. Fait nouveau : il existe déjà un support numérique, donc la ressaisie est double — la famille écrit sur papier, le bureau retape. Lecture corrigée depuis : la liste de colonnes énumérée ici n'était pas complète — le fichier porte aussi les allergies de l'enfant —, et on en avait tiré à tort que l'administratif et le médical étaient déjà séparés."
    feedback: à envoyer
