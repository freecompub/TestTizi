# État de session d'une initiative BRD — mis à jour par l'agent après chaque échange validé.
document: brd
initiative:
  name: "EcolAsso"
  slug: "ecolasso"
  trigger: "« On veut plus avoir des problème avec les parents » (SRC-001, verbatim SH-01) — le déclencheur énoncé n'est ni le temps perdu ni la ressaisie, mais la friction avec les parents. « On » n'est pas identifié (ZO-019), et aucun épisode précis n'a été donné (ZO-020)"
  derived_from: {}       # d'où elle vient, quand elle ne naît pas d'une demande mais d'une autre
                         # initiative. Renseigne `derived_from` à la création : `split_into` ne dit la
                         # filiation que vers le bas, et seulement depuis une mère close
  #  initiative: ""      # slug de l'initiative d'origine
  #  reason: decoupage   # decoupage | sortie_perimetre | autre:<libellé>
  #  decision: ""        # la décision qui l'a produite, chez la mère : DD-xx, ou sa décision d'opportunité
phase: close             # assess | discover | define | govern | close (opportunité jetée)
created: "2026-10-27"              # AAAA-MM-JJ
updated: "2026-10-27"

opportunity:              # phase Assess (references/phase-assess.md)
  request:
    verbatim: |
      On veut résoudre 2 problème pour une association qui fait des courses de soutien et de
      langues 1- l'association utiliser WhatsApp pour la communication parents profs, Prof élevé,
      c'est problématique puisque chaque année, les groupes sont créés de zéro, il y a déjà les
      erreur d'affection des bonnes personnes aux bon groupe. Les groupes sont un mix entre
      parents et élèves, les messages sont mixé. Les devoirs sont envoyés sur ces groupes avec les
      erreurs d'envoi sur le mauvais groupe. 2- les inscriptions et réinscription se font au format
      papier, si les un dossier est perdu on ne peux pas s'en rendre compte si les parents ne
      signale rien. Les parents chaque année remplisse les mêmes informations
    classification: figee  # traitée comme figée : le nom « EcolAsso » porte déjà une solution — figee (une solution précise, qui masque souvent le problème) | fluide (une aspiration vague)
    presumed_solution: "Un outil dédié à l'association (« EcolAsso ») remplaçant WhatsApp pour la communication et le papier pour les inscriptions"   # déduit du nom, à corriger — pour une demande figée : la solution présumée, à remonter au problème
  canvas:
    problems:
      - "P1 — Communication sur WhatsApp : groupes recréés de zéro chaque année, erreurs d'affectation des personnes aux groupes, groupes mixant parents et élèves, messages mélangés, devoirs envoyés sur le mauvais groupe"
      - "P1b — Conséquence confirmée (SRC-001) : les élèves du groupe qui n'a pas reçu le devoir arrivent sans l'avoir fait, et la séance se transforme en séance de rattrapage — du temps d'enseignement perdu pour tout le groupe"
      - "P1a — Détection de l'erreur d'envoi : rien ne la signale. Si l'enseignant ne s'en rend pas compte, l'erreur persiste jusqu'à ce qu'un membre du groupe la signale — un signalement humain, par un acteur non identifié, dans un délai inconnu (SRC-001)"
      - "P2 — Inscriptions et réinscriptions sur papier : un dossier perdu ne se détecte que si les parents le signalent ; les parents ressaisissent chaque année les mêmes informations"
      - "P2a — Déroulé (SRC-001, vécu par SH-01) : campagne d'avril à juin ; formulaire papier identique chaque année, à remplir autant de fois qu'il y a d'enfants ; dépôt au bureau ; attente de la validation, annoncée via WhatsApp"
      - "P2c — Ampleur (SRC-001, rapporté par SH-01) : 150 élèves inscrits, 10 groupes de cours ; 3 dossiers perdus sur la dernière campagne ; 150 formulaires papier ressaisis chaque année (un par enfant). Nombre de FAMILLES inconnu — les fratries ne sont pas comptées (ZO-018)"
      - "P1c — Ampleur (SRC-001) : 10 groupes de cours, donc au moins 10 groupes WhatsApp recréés de zéro chaque année, à peupler avec 150 élèves et leurs parents"
      - "P2b — Perte d'un dossier : personne ne prévient le parent. Il faut tout refaire. Le délai de découverte et le risque de dépasser la clôture de juin ne sont pas mesurés (ZO-015)"
      # problèmes, ou idées de solution à ramener à un problème
    users:
      - "Parents d'élèves (SH-01)"
      - "Professeurs (SH-04) — non entendus"
      - "Élèves (SH-05) — non entendus"
      # utilisateurs et clients visés — qui administre les groupes et traite les dossiers reste à identifier (ZO-007)
    solutions_today:
      - "WhatsApp, groupes recréés chaque année (communication et envoi des devoirs)"
      - "WhatsApp aussi pour annoncer la validation d'une inscription : le même canal porte le pédagogique et l'administratif"
      - "Dossiers d'inscription papier, un formulaire par enfant, ressaisis à l'identique chaque année, déposés au bureau"
    user_value: "Pour les familles : ne plus subir la lourdeur du formulaire et de la procédure chaque année (déduit du mécontentement exprimé, SRC-001 — à confirmer auprès des parents eux-mêmes)"
    user_metrics: []       # à établir : aucun indicateur côté utilisateur n'est encore nommé
    adoption: ""
    business_problem: "Friction avec les parents (SRC-001) : les parents sont agacés par la lourdeur des formulaires et de la procédure d'inscription, et l'ont exprimé PLUSIEURS FOIS en réunion. La friction porte sur P2 ; aucun mécontentement de parent n'a été rapporté sur P1 (communication WhatsApp)"
    business_metrics: []
    budget: "quelques mois"   # SRC-001, rapporté par SH-01 ; non confirmé par le décideur SH-02
  decision: decoupee       # rendue par SH-02, déclarée par l'utilisateur — en_attente | aller_plus_loin | jeter | decoupee | a_apprendre | reportee
  reason: "Deux problèmes sans porteur de douleur commun : P2 (inscriptions) est subi par les familles et exprimé en réunion ; P1 (communication) coûte du temps d'enseignement à des enseignants et des élèves que personne n'a entendus. Moments de l'année, preuves et populations différents : deux opportunités, pas une."
  to_learn: []             # si a_apprendre : - { question: "", who: "" }
  split_into: [ecolasso-inscriptions, ecolasso-communication]   # si decoupee : slugs des initiatives filles. Sans eux, « close » se relit
                           # comme un abandon — ce qui est arrivé, avec la vérité en commentaire YAML
  decided_by: SH-02        # Dédé, directeur de l'association — déclaré par l'utilisateur
  date: "2026-10-27"

