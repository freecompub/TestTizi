hypotheses:
  - id: H-001
    text: "« courses de soutien et de langues » désigne des COURS : soutien scolaire et cours de langues"
    basis: "lecture de la demande ; coquille probable"
    status: à vérifier
  - id: H-007
    text: "P1 et P2 n'ont pas le même porteur de douleur : P2 fait souffrir les familles (exprimé), P1 fait souffrir les enseignants et les élèves (non entendus, non mesuré)"
    basis: "SRC-001 : le mécontentement exprimé en réunion ne porte que sur les inscriptions"
    status: à vérifier
  - id: H-006
    text: "La ressaisie annuelle touche les 150 élèves chaque année, alors que la perte de dossier en touche 3 sur 150 (2 %) : le coût dominant de P2 est la ressaisie, pas la perte"
    basis: "calcul à partir des chiffres de SRC-001 (150 élèves, 10 groupes, 3 dossiers perdus), rapportés par un parent et non relevés dans les registres"
    status: à vérifier
  - id: H-005
    text: "Dédé, directeur de l'association, peut rendre seul la décision d'opportunité et engager le projet"
    basis: "déclaré par Samir (SH-01), parent d'élève, pas par Dédé ni par les statuts de l'association"
    status: à vérifier
  - id: H-004
    text: "P1 et P2 partagent le même canal (WhatsApp) et le même référentiel de familles : les traiter séparément recréerait deux fois la même liste de personnes"
    basis: "SRC-001 : la validation d'inscription est annoncée via WhatsApp"
    status: à vérifier
  - id: H-003
    text: "Une séance transformée en rattrapage a un coût pour l'association au-delà du temps : cours payés par les familles, programme décalé, confiance entamée"
    basis: "déduction à partir de « association de cours de soutien » ; non confirmé"
    status: à vérifier
  - id: H-002
    text: "Les deux problèmes concernent la même population (les mêmes familles, la même association) et partagent donc le même référentiel de personnes"
    basis: "déduction : les parents apparaissent dans les deux problèmes"
    status: à vérifier
