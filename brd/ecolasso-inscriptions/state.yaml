hypotheses:
  - id: H-001
    text: "« courses de soutien et de langues » désigne des COURS : soutien scolaire et cours de langues"
    basis: "lecture de la demande ; coquille probable"
    status: à vérifier
  - id: H-002
    text: "Les deux initiatives filles concernent la même population (les mêmes familles) et partagent le même référentiel de personnes"
    basis: "déduction : les parents apparaissent dans les deux problèmes"
    status: à vérifier
  - id: H-004
    text: "Les deux initiatives filles partagent le même canal (WhatsApp) et le même référentiel de familles : les traiter séparément recréerait deux fois la même liste de personnes"
    basis: "SRC-001 : la validation d'inscription est annoncée via WhatsApp"
    status: à vérifier
  - id: H-005
    text: "Dédé, directeur de l'association, peut rendre seul la décision d'opportunité et engager le projet"
    basis: "déclaré par Samir (SH-01), parent d'élève, pas par Dédé ni par les statuts"
    status: à vérifier
  - id: H-006
    text: "La ressaisie annuelle touche les 150 élèves chaque année, alors que la perte de dossier en touche 3 sur 150 (2 %) : le coût dominant est la ressaisie, pas la perte"
    basis: "calcul à partir des chiffres de SRC-001, rapportés par un parent et non relevés dans les registres"
    status: à vérifier
