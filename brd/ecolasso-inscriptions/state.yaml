business_rules:
  - id: RG-001
    statement: "Tout paiement encaissé pour frais d'inscription ou frais de scolarité ne peut faire l'objet d'un remboursement."
    kind: comportement
    enforcement: derogation_justifiee   # le règlement l'énonce sans exception, la pratique en admet au moins une
    sources: [{ ref: SRC-003, location: "règlement intérieur, article 7" }, { ref: SRC-011, location: "remboursement effectué en septembre" }]
    owner: SH-02
    rationale: ""          # non établi : pourquoi la règle existe, et sur quel fondement la dérogation est accordée
    exceptions: [RG-002]
    status: proposé
    lint_waivers:
      - { rule: L03, reason: "L'énoncé est la citation exacte de l'article 7 du règlement intérieur signé par les parents (SRC-003). On ne le reformule pas : c'est le texte qui engage." }
      - { rule: L08, reason: "Même motif : le règlement ne dit pas « doit ». C'est précisément ce flou qui a rendu RG-002 nécessaire." }
  - id: RG-003
    statement: "Toute inscription doit être réglée par virement bancaire."
    kind: comportement
    enforcement: stricte
    sources: [{ ref: SRC-022, location: "« toutes les inscriptions se font par virement »" }]
    owner: SH-02
    rationale: "Pratique constante selon SH-03. Elle n'est pas celle qu'annonce le règlement intérieur signé, qui prévoit encore un paiement en trois fois avec deux chèques différés et une option chèques à 2 € de frais (SRC-003, page 2) — ZO-082"
    exceptions: []
    status: proposé
  - id: RG-002
    statement: "Un paiement encaissé doit être remboursé lorsque l'association n'a pas pu donner suite à l'inscription parce qu'elle a perdu le dossier déposé."
    kind: comportement
    enforcement: stricte
    sources: [{ ref: SRC-018, location: "« dans les cas où l'erreur n'incombe pas au parent »" }, { ref: SRC-011, location: "remboursement effectué en septembre" }]
    owner: SH-02
    rationale: "Pratiquée au moins une fois (SRC-011) et énoncée par le président. Resserrée après SRC-019 : SH-02 pense que la perte du dossier est le SEUL cas de remboursement — hors de là, l'article 7 s'applique sans exception. Absente du règlement signé, donc inopposable par une famille en l'état (ZO-078, ZO-079)"
    exceptions: []
    status: proposé
