constraints:
  - type: legale
    text: "Le dossier d'inscription contient des données de santé (médecin traitant, mutuelle, allergies, vaccinations) concernant des mineurs, deux consentements (transport en cas d'urgence, diffusion média) et les coordonnées de tiers (personnes à contacter en cas d'urgence)"
    source: SRC-002
    implication: "Catégories particulières au sens du RGPD, sur des mineurs : base légale, durée de conservation, accès restreint, consentements révocables et traçables, information des personnes. La contrainte existe DÉJÀ sur le papier — elle n'est pas créée par l'initiative — mais elle devra être traitée explicitement et elle pèsera sur le périmètre (ZO-028)"
  - type: organisationnelle
    text: "L'accès aux informations de santé des dossiers est aujourd'hui réservé aux membres du bureau"
    source: SRC-002
    implication: "Une restriction d'accès existe déjà dans la pratique : elle est à constater avant de décrire une cible, et c'est elle qui crée R-02"
  - type: organisationnelle
    text: "Un règlement interne de l'association existe et s'impose à la procédure d'inscription"
    source: SRC-001
    implication: "Document à récupérer avant de décrire le processus cible : il peut imposer des pièces, des délais ou des validations que personne ne cite spontanément (ZO-027)"
# - { type: legale|contractuelle|organisationnelle|budgetaire|environnement|autre, text: "", source: SRC-xxx, implication: "" }
                          #   environnement : conditions réelles d'usage (bruit, lumière, mains occupées ou gantées, déplacement, connexion, interruptions, temps disponible)

