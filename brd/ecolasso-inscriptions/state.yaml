council_runs:
  - date: "2026-10-27"
    mode: preparation
    lenses: [utilisateur-final, operations-support, securite-conformite, sponsor-finance, sceptique]
    initiatives: []        # ce passage ne porte que sur ecolasso-inscriptions
    proposed: 39
    questions:
      - text: "Qui consulte les allergies, le médecin traitant, les contacts d'urgence et l'autorisation de transport pendant un cours ou une sortie, où et en combien de temps ?"
        lenses: [utilisateur-final, operations-support]
        outcome: retenue
        reason: ""
        zone: ZO-031
      - text: "Hors flux nominal : arrivée hors campagne, départ en cours d'année, information qui change après le dépôt."
        lenses: [operations-support, utilisateur-final]
        outcome: retenue
        reason: ""
        zone: ZO-032
      - text: "Chaque rubrique est-elle exigée par quelqu'un, ou collectée par habitude ? Justificatifs exigés par l'assurance ou un financeur ?"
        lenses: [sceptique, securite-conformite]
        outcome: retenue
        reason: ""
        zone: ZO-033
      - text: "WhatsApp comme canal de validation : qui envoie, quel compte, quel contenu, parents sans WhatsApp — et où passe la frontière avec l'initiative sœur ?"
        lenses: [sceptique, operations-support, utilisateur-final, securite-conformite]
        outcome: retenue
        reason: ""
        zone: ZO-034
      - text: "Le paiement d'une cotisation ou de frais fait-il partie de l'inscription et d'un dossier « complet » ?"
        lenses: [sponsor-finance, operations-support]
        outcome: retenue
        reason: ""
        zone: ZO-035
      - text: "Coût de l'inaction : que perd l'association aujourd'hui, et que se passe-t-il si rien n'est prêt avant avril ?"
        lenses: [sponsor-finance, sceptique]
        outcome: réservée
        reason: "Cinq retenues au maximum ; à reprendre au prochain passage, ou dans l'entretien avec SH-02."
      - text: "D'où vient la date d'avril, et que fait l'association si rien n'est prêt ?"
        lenses: [sponsor-finance]
        outcome: réservée
        reason: "Même motif ; recoupe la précédente."
      - text: "Autorité parentale partagée, parents séparés : qui donne les deux autorisations, et comment fait-on aujourd'hui ?"
        lenses: [securite-conformite, utilisateur-final]
        outcome: réservée
        reason: "Solide, mais le volet consentements se traitera en bloc une fois ZO-028 tranchée (périmètre RGPD dans ou hors initiative)."
      - text: "Comment retirer un consentement ou rectifier une information en cours d'année ?"
        lenses: [securite-conformite]
        outcome: réservée
        reason: "Même motif que la précédente."
      - text: "Les tiers (contacts d'urgence, médecin traitant) savent-ils que leurs coordonnées sont déposées ?"
        lenses: [securite-conformite]
        outcome: réservée
        reason: "Même motif."
      - text: "Des informations sont-elles transmises hors de l'association (mairie, financeur, fédération, assureur) ?"
        lenses: [securite-conformite]
        outcome: réservée
        reason: "Même motif."
      - text: "Que devient le dossier d'un enfant qui quitte l'association ? Une famille a-t-elle déjà demandé accès ou suppression ?"
        lenses: [securite-conformite]
        outcome: réservée
        reason: "Même motif."
      - text: "En cas d'incident, comment établir quelle version d'une information de santé faisait foi à cette date ?"
        lenses: [securite-conformite]
        outcome: réservée
        reason: "Recoupe R-01, déjà enregistré comme risque."
      - text: "Comment s'inscrit une famille qui ne lit ou n'écrit pas couramment le français, dans une association qui enseigne les langues ?"
        lenses: [utilisateur-final]
        outcome: réservée
        reason: "Cinq retenues au maximum. À poser avant toute description du processus cible."
      - text: "Existe-t-il un support de suivi (cahier, tableur, outil) où sont recopiées les informations des dossiers papier ?"
        lenses: [operations-support]
        outcome: réservée
        reason: "Cinq retenues au maximum ; à poser avec ZO-007 (qui traite les dossiers)."
      - text: "Comment se répartissent les 150 dossiers sur trois mois, et que se passe-t-il les jours de forte affluence ?"
        lenses: [operations-support]
        outcome: réservée
        reason: "Cinq retenues au maximum."
      - text: "Comment l'affectation d'un élève à l'un des 10 groupes est-elle décidée, et quel lien avec le dossier d'inscription ?"
        lenses: [operations-support]
        outcome: réservée
        reason: "Cinq retenues au maximum ; touche la frontière avec l'initiative sœur, déjà visée par ZO-034."
      - text: "Comment fait un parent qui ne peut pas se déplacer au bureau pendant les horaires d'ouverture ?"
        lenses: [utilisateur-final]
        outcome: réservée
        reason: "Cinq retenues au maximum ; recoupe ZO-032."
      - text: "Combien de temps la campagne coûte-t-elle aujourd'hui à l'association, et qui le passe ?"
        lenses: [sponsor-finance]
        outcome: réservée
        reason: "Cinq retenues au maximum ; servira de valeur de départ, à poser avec ZO-024."
      - text: "Si une seule des deux attentes pouvait être couverte avant avril, laquelle, et sur quel critère ?"
        lenses: [sponsor-finance]
        outcome: réservée
        reason: "Prématuré : l'arbitrage se posera quand le périmètre sera délimité."
      - text: "Qui tranche la répartition d'effort entre les deux initiatives filles ?"
        lenses: [sponsor-finance]
        outcome: écartée
        reason: "Déjà couvert par ZO-023 (répartition du budget entre les deux filles)."
      - text: "Quels coûts récurrents l'association est-elle prête à porter chaque année après la première campagne ?"
        lenses: [sponsor-finance]
        outcome: réservée
        reason: "Cinq retenues au maximum."
      - text: "De quels incidents précis parle-t-on derrière « problèmes avec les parents », et lesquels sont rattachés au formulaire ?"
        lenses: [sceptique]
        outcome: écartée
        reason: "Déjà répondu : agacement exprimé en réunion sur la lourdeur des formulaires et de la procédure (ZO-020 levée, SRC-001)."
      - text: "Qu'a-t-on constaté sur les trois dossiers perdus : où et quand, et qu'est-ce qui l'attribue au papier plutôt qu'au circuit ?"
        lenses: [sceptique]
        outcome: réservée
        reason: "Cinq retenues au maximum ; à poser avec ZO-007 (qui traite les dossiers)."
      - text: "Sur quoi repose le constat que seule l'assurance scolaire change chaque année ?"
        lenses: [sceptique]
        outcome: écartée
        reason: "Déjà tracé : déclaré par SH-01 dans SRC-001, enregistré comme rapporté et non vérifié sur pièce."
      - text: "BC-001 énonce un mécanisme (ne saisir que les changements) plutôt qu'une difficulté vécue."
        lenses: [sceptique]
        outcome: écartée
        reason: "Traitée en corrigeant : BC-001 reformulé pour énoncer le besoin sans prescrire le moyen."
      - text: "A-t-on observé ce que coûte à un parent de plusieurs enfants de remplir le même formulaire plusieurs fois ?"
        lenses: [utilisateur-final]
        outcome: réservée
        reason: "Cinq retenues au maximum ; recoupe ZO-018 (nombre de familles)."
      - text: "Le caractère déclaratif du dossier a-t-il déjà posé problème à l'association ?"
        lenses: [sceptique]
        outcome: réservée
        reason: "Recoupe ZO-033, retenue."
