candidate_needs:
  - id: BC-001
    text: "Pouvoir réinscrire un enfant sans réécrire les informations que l'association détient déjà et qui n'ont pas changé"
    sources: [{ ref: SRC-001, location: "« Les parents chaque année remplisse les mêmes informations »" }]
    status: proposé
    reason: ""
    notes: "Formulé à partir de la douleur exprimée, pas dicté par SH-01 : à confirmer avec lui. ZO-029 levée : seule l'assurance scolaire change à coup sûr chaque année ; le reste change rarement. La ressaisie porte donc sur onze rubriques sur douze. ATTENTION : reporter une donnée sans la faire confirmer crée un risque nouveau sur les données de santé (R-01)."
  - id: BC-002
    text: "Pouvoir savoir qu'un dossier est bien arrivé et complet, sans avoir à le demander"
    sources: [{ ref: SRC-001, location: "« si le dossier est perdu, personne ne vous le dis »" }]
    status: proposé
    reason: ""
    notes: "Couvre deux défaillances distinctes : le dossier perdu (3 sur 150) et le dossier incomplet (ZO-025)."
