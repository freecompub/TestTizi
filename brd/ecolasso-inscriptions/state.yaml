    action: entretien
    blocking: false
    status: levée
    resolution: "Le comptable (SH-07) remonte l'écart, le bureau cherche le dossier, le valide s'il le trouve, contacte les parents sinon. La procédure est saine et complète. Elle casse sur un seul point : pour une famille nouvelle, les coordonnées n'existaient que dans le dossier perdu — « sinon on peut rien faire » (SRC-015). D'où BC-005."
