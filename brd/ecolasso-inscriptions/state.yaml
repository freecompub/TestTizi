    question: "Le bilan de début juillet fait apparaître un virement sans dossier. Que se passe-t-il ensuite ? Qui regarde cet écart, qu'en fait-il, et pourquoi la place de cette famille n'a-t-elle pas été tenue alors qu'il restait deux mois ?"
