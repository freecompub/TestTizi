current_process:
  events:
    - { event: "Le parent dépose le dossier papier au bureau", actor: "parent", source: SRC-001 }
    - { event: "Un membre du bureau prend le dossier", actor: "membre du bureau", source: SRC-004 }
    - { event: "Il vérifie les données saisies et le paiement", actor: "membre du bureau", source: SRC-004 }
    - { event: "Si tout est correct, il envoie un message WhatsApp de validation", actor: "membre du bureau", source: SRC-004 }
    - { event: "Sinon, il envoie un message listant les données manquantes", actor: "membre du bureau", source: SRC-004 }
    - { event: "Le parent se déplace à nouveau au bureau pour corriger", actor: "parent", source: SRC-004 }
    - { event: "DÉBUT JUILLET, à la fin des inscriptions, le bilan rapproche les virements reçus des dossiers déposés", actor: "membre du bureau", source: SRC-014 }
    - { event: "Le COMPTABLE remonte l'écart au bureau", actor: "comptable (SH-07)", source: SRC-015 }
    - { event: "Le bureau recherche le dossier", actor: "membre du bureau", source: SRC-015 }
    - { event: "S'il le trouve : il valide l'inscription", actor: "membre du bureau", source: SRC-015 }
    - { event: "S'il ne le trouve pas : il contacte les parents — mais pour une nouvelle famille, les coordonnées n'existaient que dans le dossier perdu. « Sinon on peut rien faire »", actor: "membre du bureau", source: SRC-015 }
    - { event: "Quand un dossier pose problème et que le numéro de téléphone est disponible, le bureau appelle la famille", actor: "membre du bureau", source: SRC-012 }
    - { event: "Un fichier Excel tient le statut des dossiers ; le bureau l'y consulte pour savoir si un dossier est « ok ou non ». Le moment où il est rempli n'est pas établi (ZO-045)", actor: "membre du bureau", source: SRC-004 }
  # reconstitué en Discover (atelier, entretiens)
#  - { event: "Dossier reçu", actor: "", source: SRC-xxx }

constraints:
  - type: legale
    text: "La structure est une association loi 1901 exerçant sous le nom « Institut ESC » : c'est elle, personne morale, qui est responsable des données collectées, représentée selon ses statuts"
    source: SRC-016
    implication: "Le périmètre incluant désormais les obligations sur les données (DD-02), il faut savoir qui engage l'association et qui en répond : ZO-076"
  - type: legale
    text: "Le dossier d'inscription contient des données de santé (médecin traitant, mutuelle, allergies, vaccinations) concernant des mineurs, deux consentements (transport en cas d'urgence, diffusion média) et les coordonnées de tiers (personnes à contacter en cas d'urgence)"
    source: SRC-002
    implication: "Catégories particulières au sens du RGPD, sur des mineurs : base légale, durée de conservation, accès restreint, consentements révocables et traçables, information des personnes. La contrainte existe DÉJÀ sur le papier — elle n'est pas créée par l'initiative — mais elle devra être traitée explicitement et elle pèsera sur le périmètre (ZO-028)"
  - type: contractuelle
    text: "Le règlement intérieur (page 5 du dossier) est signé obligatoirement par les parents à chaque inscription : absences justifiées par écrit, correspondance écrite à la Direction, aucun remboursement des frais d'inscription ou de scolarité"
    source: SRC-003
    implication: "La signature du règlement est un engagement contractuel annuel, absent de la liste des douze rubriques : elle fait partie de ce qu'une réinscription doit produire (BC-001)"
  - type: organisationnelle
    text: "L'accès aux informations de santé des dossiers est aujourd'hui réservé aux membres du bureau"
    source: SRC-002
    implication: "Une restriction d'accès existe déjà dans la pratique : elle est à constater avant de décrire une cible, et c'est elle qui crée R-02"
  - type: organisationnelle
    text: "Un règlement interne de l'association existe et s'impose à la procédure d'inscription"
    source: SRC-001
    implication: "Document à récupérer avant de décrire le processus cible : il peut imposer des pièces, des délais ou des validations que personne ne cite spontanément (ZO-027)"
# - { type: legale|contractuelle|organisationnelle|budgetaire|environnement|autre, text: "", source: SRC-xxx, implication: "" }
                          #   environnement : conditions réelles d'usage (bruit, lumière, mains occupées ou gantées, déplacement, connexion, interruptions, temps disponible)

