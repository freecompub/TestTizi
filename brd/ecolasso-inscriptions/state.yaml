# État de session d'une initiative BRD — mis à jour par l'agent après chaque échange validé.
document: brd
initiative:
  name: "EcolAsso — Inscriptions et réinscriptions"
  slug: "ecolasso-inscriptions"
  trigger: "« On veut plus avoir des problème avec les parents » (SRC-006, verbatim SH-02, dicté) : agacement exprimé plusieurs fois en réunion sur la lourdeur des formulaires et de la procédure. C'est le déclencheur de l'initiative mère, et il porte sur CETTE fille."
  derived_from:
    initiative: ecolasso
    reason: decoupage
    decision: "décision d'opportunité d'EcolAsso du 2026-10-27 (decoupee), rendue par SH-02"
  # d'où elle vient, quand elle ne naît pas d'une demande mais d'une autre
                         # initiative. Renseigne `derived_from` à la création : `split_into` ne dit la
                         # filiation que vers le bas, et seulement depuis une mère close
  #  initiative: ""      # slug de l'initiative d'origine
  #  reason: decoupage   # decoupage | sortie_perimetre | autre:<libellé>
  #  decision: ""        # la décision qui l'a produite, chez la mère : DD-xx, ou sa décision d'opportunité
phase: discover          # assess | discover | define | govern | close (opportunité jetée)
created: "2026-10-27"              # AAAA-MM-JJ
updated: "2026-10-28"

opportunity:              # phase Assess (references/phase-assess.md)
  request:
    verbatim: |
      Héritée d'EcolAsso (SRC-001, verbatim de SH-01) : les inscriptions et réinscription se font au format papier, si les un dossier est perdu on ne peux pas s'en rendre compte si les parents ne signale rien. Les parents chaque année remplisse les mêmes informations
    
    classification: figee  # héritée d'EcolAsso : le nom portait déjà une solution — figee (une solution précise, qui masque souvent le problème) | fluide (une aspiration vague)
    presumed_solution: ""  # pour une demande figée : la solution présumée, à remonter au problème
  canvas:
    problems:
      - "P2 — Inscriptions et réinscriptions sur papier : un dossier perdu ne se détecte que si les parents le signalent ; les parents ressaisissent chaque année les mêmes informations"
      - "P2a — Déroulé (SRC-001, vécu par SH-01) : campagne d'avril à juin ; formulaire papier identique chaque année, à remplir autant de fois qu'il y a d'enfants ; dépôt au bureau ; attente de la validation, annoncée via WhatsApp"
      - "P2b — Perte d'un dossier : personne ne prévient le parent. Il faut tout refaire. Délai de découverte et risque de dépasser la clôture de juin non mesurés (ZO-015)"
      - "P2c — Ampleur (SRC-001) : 150 élèves, 3 dossiers perdus sur la dernière campagne, 150 formulaires ressaisis chaque année. Nombre de familles inconnu (ZO-018)"
    users:
      - "Parents d'élèves (SH-01)"
      - "Qui reçoit et traite les dossiers au bureau : non identifié (ZO-007)"
    solutions_today:
      - "Dossiers d'inscription papier, un formulaire par enfant, ressaisis à l'identique chaque année, déposés au bureau"
      - "WhatsApp pour annoncer la validation d'une inscription"
    user_value: "Pour les familles : ne plus subir la lourdeur du formulaire et de la procédure chaque année (déduit du mécontentement exprimé, SRC-001 — à confirmer auprès des parents eux-mêmes)"
    user_metrics: []       # aucun indicateur côté utilisateur n'est encore nommé
    adoption: ""           # non abordé en Assess
    business_problem: "Friction avec les parents (SRC-001) : agacement exprimé PLUSIEURS FOIS en réunion sur la lourdeur des formulaires et de la procédure. C'est le déclencheur de toute l'initiative mère."
    business_metrics:
      - "Inscriptions abouties sans problème (définition et valeur actuelle inconnues — ZO-024)"
      - "Dossiers incomplets (définition et valeur actuelle inconnues — ZO-025)"
    budget: "quelques mois"   # budget annoncé pour l'ensemble, à répartir entre les deux filles (ZO-023)
  decision: aller_plus_loin   # rendue par SH-02, déclarée par l'utilisateur — en_attente | aller_plus_loin | jeter | decoupee | a_apprendre | reportee
  reason: "Une douleur exprimée plusieurs fois en réunion, des volumes connus (150 élèves, 150 formulaires ressaisis chaque année, 3 dossiers perdus) et une échéance réelle : la campagne d'inscription démarre en avril. Le problème mérite une découverte ; ce n'est pas un engagement à construire."
  to_learn: []             # si a_apprendre : - { question: "", who: "" }
  split_into: []           # si decoupee : slugs des initiatives filles. Sans eux, « close » se relit
                           # comme un abandon — ce qui est arrivé, avec la vérité en commentaire YAML
  decided_by: SH-02        # Dédé, directeur de l'association — déclaré par l'utilisateur
  date: "2026-10-27"

problem:
  statement: ""          # 2-3 phrases, confirmées par l'utilisateur
  confirmed: false
  symptoms: []
  impact: []             # temps, coût, risque, qualité

success_signals:
  - text: "Des inscriptions qui aboutissent sans problème"
    measurable: false      # ni définition de « sans problème », ni valeur actuelle : ZO-024, ZO-026
  - text: "Moins de dossiers incomplets"
    measurable: false      # premier énoncé de ce mode de défaillance (SRC-001) ; ni définition, ni baseline : ZO-025


