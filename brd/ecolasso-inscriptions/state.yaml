    question: "Le dossier signé par les parents annonce un règlement possible en trois fois, avec deux chèques différés en mai et juin, et une option chèques à 2 € de frais. La pratique est le virement pour tous. Un parent qui se présente avec des chèques, en s'appuyant sur le document qu'on lui a remis, se voit-il refuser ? Le texte doit-il être corrigé, ou la pratique élargie ?"
    origin: SRC-022
    ask_to: SH-02
    action: decision
    blocking: false
    status: ouverte
    resolution: ""
    related: [RG-003, SRC-003, ZO-079]
  - id: ZO-081
    type: probleme_flou
    question: "Le règlement intérieur prévoit un paiement par chèques moyennant 2 € de frais. Un règlement SANS virement est-il possible ? Si oui, et si les chèques sont déposés avec le dossier, la perte du dossier emporte aussi la seule preuve : ni détection au bilan, ni recours pour le parent."
    origin: SRC-021
    ask_to: SH-03
    action: entretien
    blocking: false
    status: levée
    resolution: "Non : toutes les inscriptions se font par virement (SRC-022). Le filet du virement couvre donc 100 % des inscriptions. En revanche, le règlement intérieur signé prévoit encore un règlement par chèques : écart entre le texte et la pratique, ZO-082."
    related: [H-017, R-03, R-04, SRC-003]
  - id: ZO-080
    type: probleme_flou
    question: "Sur quoi SH-02 tranche-t-il une contestation ? Un dossier perdu ne laisse aucune trace, par construction : quelle preuve un parent peut-il apporter qu'il a bien déposé, et quelle preuve l'association peut-elle opposer ?"
    origin: SRC-020
    ask_to: SH-02
    action: entretien
    blocking: false
    status: levée
    resolution: "Le virement (SRC-021). C'est la seule trace qui survit à la perte du dossier : elle sert à la fois à DÉTECTER l'écart au bilan de juillet et à PROUVER la démarche du parent en cas de contestation. Reste le cas d'un règlement sans virement : ZO-081."
    related: [RG-002, R-04, H-013]
