    resolution: "DD-02 : c'est dans le périmètre. Les questions de fait qui restaient (responsable de traitement, lieu et durée de conservation, accès) deviennent des zones à instruire : ZO-071 à ZO-075."
    related: [BC-001]
  - id: ZO-029
    type: probleme_flou
    question: "Parmi les douze rubriques du dossier, lesquelles changent réellement d'une année sur l'autre ? Question posée, restée sans réponse — c'est elle qui sépare « tout réécrire » de « confirmer ce qui n'a pas bougé », donc elle dimensionne BC-001."
    origin: SRC-002
    ask_to: SH-01
    action: entretien
    blocking: false
    status: levée
    resolution: "Seule l'assurance scolaire change à coup sûr tous les ans. Le reste peut changer, mais rarement (SRC-001, SH-01). La ressaisie est donc redondante sur onze rubriques sur douze pour la plupart des familles."
    related: [BC-001]
  - id: ZO-024
    type: succes_non_mesurable
    question: "Qu'est-ce qu'une inscription « réussie sans problème » ? Et combien y en a-t-il aujourd'hui sur 150 ? Sans définition ni valeur de départ, l'indicateur ne pourra pas dire si quoi que ce soit s'est amélioré."
    origin: point-etape
    ask_to: SH-02
    action: question-utilisateur
    blocking: false
    status: ouverte
    resolution: ""
    related: []
  - id: ZO-025
    type: probleme_flou
    question: "Les « dossiers incomplets » n'avaient jamais été mentionnés : combien par campagne, à quoi reconnaît-on un dossier incomplet, et qui court après les pièces manquantes ? C'est un troisième mode de défaillance, distinct de la perte et de la ressaisie."
    origin: point-etape
    ask_to: SH-02
    action: entretien
    blocking: false
    status: ouverte
    resolution: ""
    related: [ZO-007]
  - id: ZO-026
    type: attendu_implicite
    question: "Les deux indicateurs proposés mesurent la réussite du côté de l'association (dossiers traités), aucun du côté des familles — alors que le déclencheur est leur agacement. Qu'est-ce qui dirait, côté parent, que ça s'est amélioré ?"
    origin: point-etape
    ask_to: SH-01
    action: entretien
    blocking: false
    status: ouverte
    resolution: ""
    related: []
  - id: ZO-027
    type: hypothese_non_verifiee
    question: "Que contient le règlement interne au sujet des inscriptions : pièces obligatoires, délais, validations, conditions de refus ? Document annoncé, à récupérer."
    origin: point-etape
    ask_to: SH-01
    action: document
    blocking: false
    status: levée
    resolution: "Le règlement intérieur est la page 5 du dossier lui-même (SRC-003), sept articles, avec signature obligatoire des parents. Il n'était donc pas à récupérer ailleurs. Il impose l'écrit pour les absences et la correspondance, et pose le non-remboursement des frais."
    related: []
  - id: ZO-023
    type: perimetre_flou
    question: "Le budget « quelques mois » a été annoncé pour l'ensemble, avant le découpage. Combien pour CETTE initiative ?"
    origin: cadrage
    ask_to: SH-02
    action: decision
    blocking: false
    status: ouverte
    resolution: ""
    related: []
