    question: "Les professeurs appellent le bureau en cas d'urgence sans avoir accès aux informations de santé : combien de fois est-ce arrivé, en combien de temps obtiennent-ils la réponse, et est-ce déjà arrivé qu'ils ne joignent personne ?"
    origin: SRC-002
    ask_to: SH-04
    action: entretien
    blocking: false
    status: ouverte
    resolution: ""
    related: [R-02, SH-04]
  - id: ZO-030
    type: attendu_implicite
    question: "La ressaisie annuelle force aujourd'hui les parents à relire toutes les informations de santé de leur enfant. Est-ce que quelqu'un compte sur cet effet — un enseignant, un responsable d'activité — et que se passerait-il si plus personne ne relisait ces rubriques chaque année ?"
    origin: SRC-002
    ask_to: SH-02
    action: entretien
    blocking: false
    status: ouverte
    resolution: ""
    related: [BC-001, R-01]
  - id: ZO-028
    type: perimetre_flou
    question: "Données de santé de mineurs et consentements : qui est responsable de traitement dans l'association, où sont conservés les dossiers papier aujourd'hui, pendant combien de temps, et qui y a accès ? Et le traitement de ces obligations est-il dans le périmètre de l'initiative ou hors de lui ?"
    origin: SRC-002
    ask_to: SH-02
    action: decision
    blocking: false
    status: ouverte
    resolution: ""
    related: [BC-001]
  - id: ZO-029
    type: probleme_flou
    question: "Parmi les douze rubriques du dossier, lesquelles changent réellement d'une année sur l'autre ? Question posée, restée sans réponse — c'est elle qui sépare « tout réécrire » de « confirmer ce qui n'a pas bougé », donc elle dimensionne BC-001."
    origin: SRC-002
    ask_to: SH-01
    action: entretien
    blocking: false
    status: levée
    resolution: "Seule l'assurance scolaire change à coup sûr tous les ans. Le reste peut changer, mais rarement (SRC-001, SH-01). La ressaisie est donc redondante sur onze rubriques sur douze pour la plupart des familles."
    related: [BC-001]
  - id: ZO-024
    type: succes_non_mesurable
    question: "Qu'est-ce qu'une inscription « réussie sans problème » ? Et combien y en a-t-il aujourd'hui sur 150 ? Sans définition ni valeur de départ, l'indicateur ne pourra pas dire si quoi que ce soit s'est amélioré."
    origin: point-etape
    ask_to: SH-02
    action: question-utilisateur
    blocking: false
    status: ouverte
    resolution: ""
    related: []
  - id: ZO-025
    type: probleme_flou
    question: "Les « dossiers incomplets » n'avaient jamais été mentionnés : combien par campagne, à quoi reconnaît-on un dossier incomplet, et qui court après les pièces manquantes ? C'est un troisième mode de défaillance, distinct de la perte et de la ressaisie."
    origin: point-etape
    ask_to: SH-02
    action: entretien
    blocking: false
    status: ouverte
    resolution: ""
    related: [ZO-007]
  - id: ZO-026
    type: attendu_implicite
    question: "Les deux indicateurs proposés mesurent la réussite du côté de l'association (dossiers traités), aucun du côté des familles — alors que le déclencheur est leur agacement. Qu'est-ce qui dirait, côté parent, que ça s'est amélioré ?"
    origin: point-etape
    ask_to: SH-01
    action: entretien
    blocking: false
    status: ouverte
    resolution: ""
    related: []
  - id: ZO-027
    type: hypothese_non_verifiee
    question: "Que contient le règlement interne au sujet des inscriptions : pièces obligatoires, délais, validations, conditions de refus ? Document annoncé, à récupérer."
    origin: point-etape
    ask_to: SH-01
    action: document
    blocking: false
    status: ouverte
    resolution: ""
    related: []
  - id: ZO-023
    type: perimetre_flou
    question: "Le budget « quelques mois » a été annoncé pour l'ensemble, avant le découpage. Combien pour CETTE initiative ?"
    origin: cadrage
    ask_to: SH-02
    action: decision
    blocking: false
    status: ouverte
    resolution: ""
