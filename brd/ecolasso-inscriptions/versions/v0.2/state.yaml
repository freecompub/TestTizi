    blocking: false
    status: levée
    resolution: "Le virement (SRC-021). C'est la seule trace qui survit à la perte du dossier : elle sert à la fois à DÉTECTER l'écart au bilan de juillet et à PROUVER la démarche du parent en cas de contestation. Reste le cas d'un règlement sans virement : ZO-081."
