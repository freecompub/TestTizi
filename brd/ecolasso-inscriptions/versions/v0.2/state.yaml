hypotheses:
  - id: H-024
    text: "Ce qui impose le déplacement n'est pas le dossier dans son ensemble mais ce qui doit être SIGNÉ. La preuve de virement voyage déjà par message parce qu'elle ne porte aucune signature ; les autorisations, elles, tirent leur valeur de la main du parent (BC-006, BR-010)"
    basis: "déduction à partir de SRC-052 — une seule pièce fait exception, et c'est la seule sans signature ; personne ne l'a énoncé ainsi"
    status: à vérifier
  - id: H-023
    text: "Valider un dossier coûte dix minutes aujourd'hui parce qu'il faut relire douze rubriques entièrement réécrites. Si la famille ne redonne que ce qui a changé (BR-001), ce temps devrait baisser — et le bureau deviendrait gagnant à OBJ-01, pas seulement les familles. Ce serait la contrepartie de la charge de relance que BR-009 lui ajoute"
    basis: "déduction à partir de SRC-049 (10 minutes par dossier) et de SRC-002 (onze rubriques sur douze inchangées) ; personne ne l'a énoncé et rien ne mesure le temps par rubrique"
    status: à vérifier
  - id: H-022
    text: "SH-03 attend d'un dispositif contrôlé la disparition des dossiers incomplets. L'attente porte sur des omissions de deux natures différentes : une information non remplie, qu'un contrôle au dépôt peut refuser, et un document non signé, dont rien ne dit qu'il se laisse contrôler de la même façon"
    basis: "attente d'effet énoncée en SRC-047, non vérifiée ; elle devient testable par l'indicateur « nombre de dossiers incomplets », à condition d'en avoir la valeur de départ (ZO-025)"
    status: à vérifier
  - id: H-021
    text: "Pour les quelque 135 familles qui se réinscrivent, le gain de ne plus ressaisir n'arrive pas à la première campagne mais à la suivante : la première fois, il faut bien que leurs informations entrent quelque part. SH-01 le dit lui-même sans le formuler ainsi — « je me dirais que L'ANNÉE PROCHAINE je n'ai pas tout ça à ressaisir »"
    basis: "déduction à partir de SRC-035 ; personne ne l'a énoncé"
    status: à vérifier
  - id: H-020
    text: "« Jamais arrivé » peut vouloir dire « jamais remonté » : une urgence survenant pendant un cours est vécue par l'enseignant, et rien n'établit qu'elle parvienne au bureau. La seule personne qui saurait — un enseignant (SH-04) — n'a jamais été entendue"
    basis: "déduction à partir de SRC-029 et de R-02 ; aucune trace d'incident n'a été évoquée"
    status: à vérifier
  - id: H-019
    text: "Le comptable, extérieur à l'association, accède à des données nominatives de familles : pour rapprocher les virements reçus des dossiers déposés, il faut lire le libellé des virements, donc des noms"
    basis: "déduction à partir de SRC-015 (il remonte l'écart) et SRC-025 (il est extérieur) ; personne ne l'a dit"
    status: à vérifier
  - id: H-001
    text: "« courses de soutien et de langues » désigne des COURS : soutien scolaire et cours de langues"
    basis: "lecture de la demande ; coquille probable"
    status: confirmée      # validé par SH-02 le 2026-10-28
    verdict: "Tous les échanges de la séance portent sur des cours de soutien scolaire et de langues ; aucune course n'a jamais été mentionnée."
  - id: H-002
    text: "Les deux initiatives filles concernent la même population (les mêmes familles) et partagent le même référentiel de personnes"
    basis: "déduction : les parents apparaissent dans les deux problèmes"
    status: à vérifier
  - id: H-004
    text: "Les deux initiatives filles partagent le même canal (WhatsApp) et le même référentiel de familles : les traiter séparément recréerait deux fois la même liste de personnes"
    basis: "SRC-001 : la validation d'inscription est annoncée via WhatsApp"
    status: à vérifier
  - id: H-005
    text: "Dédé peut rendre seul la décision d'opportunité et engager le projet"
    basis: "d'abord déclaré par Samir (SH-01), puis confirmé par l'intéressé : SH-02 est le PRÉSIDENT de l'association loi 1901, en plus d'en être le directeur (SRC-017). Les décisions rendues en son nom n'ont donc pas à être ratifiées. Réserve : les statuts n'ont pas été lus, et ce sont eux qui font foi"
    status: confirmée
  - id: H-018
    text: "Le risque grave ne se mesure pas sur 150 mais sur 10 à 15, et il est récurrent (« de temps à autre »), pas exceptionnel : il ne concerne que les familles primo-inscrites. Le ratio « 3 dossiers perdus sur 150 » comparait un numérateur à un dénominateur qui n'est pas le sien"
    basis: "SRC-023 : 10 à 15 nouvelles inscriptions par an. SRC-011 : le cas de perte de place concernait une primo-inscription. H-013 : seules les primo-inscrites sont effacées par la perte du dossier"
    status: confirmée      # validé par SH-02 le 2026-10-28
    verdict: "Établie par SRC-023 : 10 à 15 primo-inscriptions par campagne, et la perte « arrive de temps à autre ». Le dénominateur du risque grave n'est pas 150."
  - id: H-017
    text: "Le virement est la seule trace d'une inscription qui survive à la perte du dossier. Il remplit deux rôles sans avoir été conçu pour : détecter l'écart au bilan de juillet, et établir la bonne foi du parent en cas de contestation"
    basis: "SRC-012 (détection), SRC-021 (preuve), SRC-022 (toutes les inscriptions passent par virement, donc le filet couvre 100 % des cas). Les deux usages ont été décrits séparément, à vingt minutes d'intervalle, sans que le lien soit fait"
    status: confirmée
  - id: H-016
    text: "La perte du dossier par l'association est le seul cas où un paiement est remboursé"
    basis: "SRC-019 (« je pense »), puis SRC-023 lu comme une infirmation, puis SRC-024 : « il n'y a que ce cas ». Trois énoncés en trois tours, de la même personne, qui rapporte des faits tenus par le comptable"
    status: confirmée      # validé par SH-02 le 2026-10-28
    verdict: "« Il n'a que ce cas » (SRC-024), dit après que l'affirmation a varié trois fois. Tenue pour confirmée sur la parole de SH-02 ; ZO-084 reste le moyen de la prouver sur pièce."
  - id: H-015
    text: "Le chiffre de « 3 dossiers perdus » ne compte que les familles qui sont revenues se manifester. Une famille nouvelle dont le dossier disparaît et qui ne revient pas est invisible : rien dans les registres ne garde trace de sa tentative. Le nombre réel de dossiers perdus est donc inconnu et, en l'état, inconnaissable"
    basis: "H-013 confirmée : pour une nouvelle famille, le dossier déposé est le seul enregistrement de son existence"
    status: confirmée      # validé par SH-02 le 2026-10-28
    verdict: "« Sinon on peut rien faire » (SRC-015) : une famille nouvelle dont le dossier disparaît et qui ne revient pas n'est comptée nulle part. Le chiffre de trois ne pouvait donc compter que celles qui se sont manifestées."
  - id: H-013
    text: "Pour une famille qui s'inscrit POUR LA PREMIÈRE FOIS, le dossier papier déposé est le seul enregistrement de son existence : ni ligne antérieure dans le fichier, ni groupe, ni historique. Perdre le papier, ce n'est pas égarer un document, c'est effacer la demande et la famille avec"
    basis: "SRC-011 : les informations de contact n'étaient que dans le dossier perdu, et c'était une nouvelle inscription"
    status: confirmée
  - id: H-014
    text: "Un rapprochement entre virements reçus et dossiers déposés permet de DÉTECTER l'anomalie : un paiement sans dossier. La détection est possible même quand le contact ne l'est pas"
    basis: "SRC-012 : « on détecte l'écart avec les virements reçus » — le mécanisme existe déjà dans la pratique du bureau"
    status: confirmée
  - id: H-012
    text: "Les besoins candidats servent DEUX populations distinctes : BC-001, BC-003 et BC-004 soulagent les familles qui se réinscrivent (fréquent et pénible) ; BC-002 protège les familles qui s'inscrivent pour la première fois (rare et grave). Les traiter comme un seul problème masque que ce sont deux populations, deux fréquences et deux enjeux"
    basis: "SRC-010 : le risque de perdre sa place ne touche généralement que les nouveaux inscrits, les réinscriptions étant relancées"
    status: confirmée      # validé par SH-02 le 2026-10-28
    verdict: "Tenue pour acquise tout au long du cadrage, et consacrée par DD-03, qui a arbitré entre les deux populations en les traitant comme distinctes."
  - id: H-011
    text: "Le fichier Excel (nom, prénom, téléphones des parents) est exactement la matière dont l'initiative sœur a besoin pour constituer ses groupes WhatsApp chaque année : les deux initiatives dépendent déjà du même fichier"
    basis: "SRC-004 : contenu du fichier ; et SRC-001 : les groupes sont recréés de zéro chaque année et peuplés à la main"
    status: à vérifier
  - id: H-009
    text: "Le fichier Excel contient déjà les informations des dossiers : la matière d'une réinscription sans ressaisie existerait donc déjà dans l'association"
    basis: "SRC-004 : le statut d'un dossier y est consultable, ce qui supposait que le dossier y ait été saisi"
    status: infirmée       # le fichier ne porte que nom, prénom, téléphones des parents et statut (SRC-004). Les douze rubriques du dossier n'existent QUE sur le papier
  - id: H-010
    text: "La ressaisie n'est pas seulement celle des familles : le bureau recopie les dossiers papier dans le fichier Excel. Le même contenu est donc écrit au moins deux fois par an et par enfant"
    basis: "SRC-004, déduction du fait qu'un statut par dossier y est consultable"
    status: infirmée       # le bureau ne recopie que quatre champs, pas le dossier. La seconde saisie existe mais elle est marginale
  - id: H-008
    text: "Les « 3 dossiers perdus » ne sont peut-être pas perdus : un dossier dont le message de validation n'a jamais été envoyé est indiscernable, côté parent, d'un dossier égaré"
    basis: "SRC-004, première version : le seul signal reçu par le parent semblait être un message WhatsApp qu'un humain doit penser à envoyer, sans aucun registre"
    status: partiellement infirmée   # un registre EXISTE : un fichier Excel porte le statut des dossiers (SRC-004). La trace n'est donc pas absente côté bureau — elle est absente côté PARENT, qui ne peut pas la consulter. L'hypothèse se réécrit en ces termes.
  - id: H-006
    text: "La ressaisie annuelle touche les 150 élèves chaque année, alors que la perte de dossier en touche 3 sur 150 (2 %) : le coût dominant est la ressaisie, pas la perte"
    basis: "calcul à partir des chiffres de SRC-001, rapportés par un parent et non relevés dans les registres"
    status: infirmée      # validé par SH-02 le 2026-10-28
    verdict: "Le raisonnement était faux et a été rétracté en séance : il mesurait le risque grave sur 150 familles au lieu de 10 à 15, et traitait comme marginal un préjudice récurrent. Remplacée par H-018. Le constat sur l'étendue de la ressaisie reste vrai, mais il ne sert plus à hiérarchiser."
#  - id: H-001
#    text: ""
#    basis: ""             # sur quoi repose l'hypothèse
#    status: à vérifier    # à vérifier | confirmée | infirmée

shadow_zones:
  - id: ZO-117
    type: probleme_flou
    question: "Pour chacune des treize pièces du dossier, qu'est-ce qui exigerait une présence physique : une signature manuscrite, un original à voir, une vérification de visu, ou rien du tout ? La preuve de virement voyage déjà par message (SRC-052) ; personne n'a jamais dit ce qui distingue les autres."
    origin: SRC-052
    ask_to: SH-03
    action: entretien
    blocking: false
    status: ouverte
    resolution: ""
    related: [BC-014, BR-017, BR-004, BR-010, BR-013, H-024, ZO-033]
  - id: ZO-116
    type: probleme_flou
    question: "Le canal de réponse est choisi par celui qui traite le dossier (SRC-050) : une famille peut donc recevoir un mail, ou un message WhatsApp, selon qui s'en occupe. Comment lui dire alors où attendre la réponse — et que vaut l'absence de message comme signal d'alerte, si elle ne sait pas où elle devrait arriver ?"
    origin: SRC-050
    ask_to: SH-02
    action: decision
    blocking: false
    status: levée
    resolution: "DD-07 : WhatsApp est le canal prioritaire (SRC-051) → RG-007. Un critère est ajouté à BR-006 : la famille doit savoir par quel canal l'accusé lui parvient. Reste non traité : « prioritaire » suppose un recours, et ni son déclencheur ni le cas de la famille sans WhatsApp ne sont établis (ZO-049)."
    related: [BR-006, BR-007, ZO-049, ZO-115, SRC-004]
  - id: ZO-115
    type: probleme_flou
    question: "Les relances partent PAR MAIL (SRC-049), alors que tous les échanges précédents ne décrivaient que WhatsApp — y compris le message de validation d'une inscription (SRC-004). D'où viennent ces adresses, toutes les familles en ont-elles une, et par quel canal partiraient l'accusé de réception de BR-006 et le message de BR-007 ? Le coût de la campagne et la portée de BR-008 en dépendent."
    origin: SRC-049
    ask_to: SH-03
    action: entretien
    blocking: false
    status: levée
    resolution: "LEVÉE : les coordonnées — mail compris — viennent du formulaire, et le canal est choisi par celui qui traite le dossier (SRC-050). Deux conséquences : AUCUN moyen de contact ne survit à la perte du dossier, ce qui fait de BR-008 un besoin entièrement neuf et non la formalisation d'un existant ; et le canal n'étant pas établi, la famille ne sait pas où attendre la réponse → ZO-116."
    related: [BR-006, BR-007, BR-008, BR-009, ZO-039, ZO-049, SRC-004]
  - id: ZO-110
    type: perimetre_flou
    question: "DD-02 a fait entrer dans le périmètre les obligations liées aux données de santé de mineurs, aux consentements et aux coordonnées de tiers. Aucun des trois objectifs et aucune des treize exigences ne les porte. Et personne n'énonce QUI PEUT LIRE QUOI : aujourd'hui l'accès aux dossiers est réservé aux membres du bureau, BR-011 l'ouvre à « la personne présente auprès de l'enfant », et aucune exigence ne dit où s'arrête cet accès. Quel objectif et quelles exigences portent ces obligations ?"
    origin: council:securite-conformite
    ask_to: SH-02
    action: decision
    blocking: true
    status: levée
    resolution: "LEVÉE le 2026-10-28. DD-02 est désormais portée par OBJ-04 et par trois exigences validées : BR-014 (raison et durée de conservation de chaque information), BR-015 (limite de lecture des informations de santé — la borne que BR-011 n'avait pas), BR-016 (information des familles, destinataires extérieurs nommés). Trois besoins candidats sourcés les précèdent : BC-011, BC-012, BC-013, adossés à SRC-048 qui enregistre DD-02 comme source."
    related: [DD-02, BR-011, OBJ-03, ZO-095, ZO-028, ZO-071, ZO-106]
    blocking_reason: "Le BRD serait soumis à approbation en déclarant un périmètre qu'il ne couvre par aucune exigence. Un approbateur ne peut pas approuver ce qui n'est pas écrit, et l'élargissement d'accès de BR-011 est déjà validé sans borne."
  - id: ZO-111
    type: perimetre_flou
    question: "La relance de TOUTES les familles attendues s'ajoute à la vérification de quelque 150 dossiers, sur les mêmes semaines d'avril à juin, et repose sur des bénévoles. Le dossier la désigne lui-même comme le changement d'organisation le plus lourd, et rien ne la borne : ni objectif, ni critère d'acceptation, ni exigence de transition. Qu'est-ce qui, dans le travail de campagne actuel, cesse ou passe à quelqu'un d'autre pour lui faire place ? Et à partir de quel volume le bureau ne suit plus ?"
    origin: council:operations-support
    ask_to: SH-03
    action: entretien
    blocking: false
    status: ouverte
    resolution: "PARTIELLE : la valeur de départ existe enfin (SRC-049). Trois personnes tiennent la campagne ; valider un dossier prend dix minutes, soit environ 25 heures pour 150 dossiers, réparties sur trois bénévoles. Et surtout : LES RELANCES COÛTENT DÉJÀ PLUS QUE LA VALIDATION — or c'est précisément elles que BR-009 étend. Reste sans réponse : ce qui cède pour faire place, et le seuil au-delà duquel le bureau ne suit plus."
    related: [BR-009, "target_process.org_impacts", "transition_requirements", R-05]
  - id: ZO-112
    type: probleme_flou
    question: "Le processus cible décrit comment la famille APPREND qu'une pièce manque, mais aucun événement ne décrit comment elle la REMET. Le déplacement au bureau — pour déposer, puis pour corriger — n'y est rangé ni en modifié, ni en supprimé, ni en inchangé. Or l'aller-retour est le premier irritant que SH-01 a nommé, et le déclencheur visait « la lourdeur des formulaires ET de la procédure ». Par quel chemin la pièce manquante revient-elle, et ce chemin évite-t-il le déplacement ?"
    origin: council:utilisateur-final
    ask_to: SH-03
    action: entretien
    blocking: false
    status: levée
    resolution: "LEVÉE : le chemin de retour est le bureau, physiquement, avec une exception déjà pratiquée — la preuve de virement part par WhatsApp (SRC-052). Le trou était réel : BR-007 pouvait être tenue sans que l'aller-retour bouge. Comblé par BC-014 et BR-017, proposés. Reste ZO-117 : ce qui, pièce par pièce, exige une présence physique."
    related: [BR-007, BR-013, "target_process", SRC-009, SRC-047]
  - id: ZO-113
    type: probleme_flou
    question: "BR-012 exige qu'aucune donnée de santé ne tienne à un exemplaire unique qui sort. BR-005 autorise la famille à corriger une information à tout moment, y compris en cours d'année. Aucune exigence ne dit qui maintient les exemplaires cohérents, ni quelle trace garde un remplacement — alors que c'est au seul endroit du dossier où une donnée périmée fait un dommage physique. Qui reçoit une correction hors campagne, et comment l'exemplaire atteignable en urgence cesse-t-il de porter l'ancienne valeur ?"
    origin: council:operations-support
    ask_to: SH-02
    action: entretien
    blocking: false
    status: levée
    resolution: "LEVÉE : deux critères ajoutés à BR-005 et validés le 2026-10-28 — une correction atteint tous les exemplaires, y compris celui qui doit être atteignable en urgence ; la date du dernier changement d'une information de santé et son auteur sont connus. La contradiction entre BR-005 et BR-012 est tranchée du côté de la cohérence."
    related: [BR-005, BR-010, BR-011, BR-012, R-01, RG-005]
  - id: ZO-114
    type: succes_non_mesurable
    question: "L'indicateur d'OBJ-02 compte « les familles dont l'inscription échoue faute d'avoir pu être jointes », avec une cible à zéro. Mais H-015 est confirmée : une famille primo-inscrite dont le dossier disparaît et qui ne revient pas ne laisse aucune trace. La cible est donc lue sur un compte qui, par construction, ne peut pas voir les cas les plus graves. Qu'est-ce qui distinguerait un zéro obtenu parce que plus personne n'est perdu d'un zéro obtenu parce que les perdus restent invisibles ?"
    origin: council:sceptique
    ask_to: SH-02
    action: decision
    blocking: false
    status: levée
    resolution: "LEVÉE : l'indicateur d'OBJ-02 est remplacé et validé le 2026-10-28. On ne compte plus les échecs — invisibles par construction, H-015 — mais la part des écarts entre familles attendues et dossiers reçus résolus avant la clôture de juin. Valeur de départ : aucun, le rapprochement se faisant début juillet."
    related: [OBJ-02, H-015, R-03, ZO-104, "success_signals"]
  - id: ZO-109
    type: probleme_flou
    question: "Une famille qui dépose son dossier AVANT de payer n'est attendue par rien jusqu'à son premier virement (DD-06). Dans quel ordre les familles font-elles les deux aujourd'hui — dépôt puis paiement, ou l'inverse ? S'il arrive qu'on dépose d'abord, il reste un angle mort exactement là où R-03 se produit."
    origin: DD-06
    ask_to: SH-03
    action: entretien
    blocking: false
    status: ouverte
    resolution: ""
    related: [DD-06, BR-009, RG-003, R-03, SH-06]
  - id: ZO-108
    type: perimetre_flou
    question: "En supprimant les chèques du règlement, on supprime aussi le paiement en trois fois qui leur était attaché (SRC-003, page 2) : deux chèques différés en mai et juin. Était-ce voulu ? Une famille qui ne peut pas payer l'année en une fois par virement fait-elle quelque chose aujourd'hui, et que fera-t-elle demain ?"
    origin: SRC-043
    ask_to: SH-02
    action: decision
    blocking: false
    status: ouverte
    resolution: "PARTIELLE : l'échelonnement existe aujourd'hui et il est la norme, entre avril et juin (SRC-044) — porté par les chèques différés dans le texte, par des virements successifs en pratique. Ce qui reste à décider, et qui se joue dans la révision : le nouveau règlement garde-t-il l'échelonnement une fois les chèques retirés ?"
    related: [DD-04, RG-003, TR-01, SRC-003, SRC-044, BR-009]
  - id: ZO-107
    type: perimetre_flou
    question: "Qui doit s'apercevoir qu'un dossier manque : l'association, ou la famille ? Les trois exigences d'OBJ-02 font toutes porter l'alerte par la famille — elle reçoit un accusé, ou elle n'en reçoit pas. Aucune n'oblige l'association à constater elle-même l'absence d'un dossier attendu avant le bilan de juillet, et aucun besoin candidat ne l'exprime. Manque-t-il un besoin, ou l'absence d'accusé suffit-elle ?"
    origin: "OBJ-02"
    ask_to: SH-02
    action: decision
    blocking: false
    status: levée
    resolution: "L'association, et elle le fait déjà : « si on a le pouvoir de contacter les parents on fait des relances » (SRC-041). La détection n'était pas absente du processus, elle était absente des exigences. Écrite en BR-009. Elle reste conditionnée à la possession d'un moyen de contact, ce qui est précisément ce que BR-008 doit garantir — les deux exigences ne valent qu'ensemble."
    related: [OBJ-02, BR-006, BR-008, BR-009, BC-002, BC-005, SH-07, R-03, ZO-060]
  - id: ZO-106
    type: contradiction
    subtype: reglementaire
    parties: [SH-02]
    question: "Ne plus faire réécrire suppose de CONSERVER d'une campagne à l'autre des informations que l'association fait aujourd'hui redonner — dont quatre rubriques de santé sur des mineurs. Le papier d'aujourd'hui est recollecté chaque année ; BR-001 et BR-002 supposent l'inverse. Pendant combien de temps l'association conserve-t-elle ces informations, et qui l'a décidé ?"
