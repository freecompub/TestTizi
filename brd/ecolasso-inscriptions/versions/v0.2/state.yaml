    type: succes_non_mesurable
    question: "Combien de familles ne se réinscrivent pas d'une année sur l'autre, et l'association le sait-elle ? On connaît les quelque 135 qui reviennent ; personne n'a dit combien auraient pu revenir."
    origin: SRC-037
