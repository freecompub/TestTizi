    note: "ASSUMÉE par SH-02 le 2026-10-28. 3 parties prenantes entendues sur 6 : ni enseignant (SH-04), ni famille primo-inscrite (SH-06), ni comptable (SH-07). La représentation retenue (SH-03 pour les enseignants, SH-01 pour les familles, SH-02 pour le comptable) couvre les faits, pas le vécu — et SH-06 est à la fois la population du risque grave R-03 et la seule voix jamais entendue. Aucune raison n'a été énoncée au moment d'assumer. Reporté en R-06."
  robustesse:
