  - id: ZO-099
    type: perimetre_flou
    question: "D'où vient l'échéance d'avril, et que se passerait-il concrètement si la campagne 2027 se déroulait exactement comme les précédentes ? Elle est invoquée dans DD-01 et DD-02 comme une contrainte, mais scope.deadline est vide et aucune source ne la rattache à un fait daté."
    origin: council:sponsor-finance
    ask_to: SH-02
    action: entretien
    blocking: false
    status: ouverte
    resolution: ""
    related: [DD-01, DD-02, "scope.deadline"]
  - id: ZO-100
    type: perimetre_flou
    question: "Si tout ne tient pas avant avril, laquelle des deux populations l'association choisit-elle de servir d'abord : les quelque 135 familles qui se réinscrivent et réécrivent tout chaque année, ou les 10 à 15 familles primo-inscrites dont l'enfant peut perdre sa place ?"
    origin: council:sponsor-finance
    ask_to: SH-02
    action: decision
    blocking: false
    status: levée
    resolution: "DD-03 : les deux, sans priorité. SH-02 a choisi en connaissance de la conséquence, qui lui était énoncée — si le temps manque avant avril, l'arbitrage se fera par les circonstances. Enregistrée en R-05."
    related: [H-012, H-006, H-018, BC-001, BC-002, BC-005, R-03, DD-03, R-05]
  - id: ZO-101
    type: succes_non_mesurable
    question: "Le signal « les familles n'expriment plus d'agacement en réunion » mesure une parole dans un lieu où les familles les plus touchées ne viennent peut-être pas (H-015). Qu'est-ce qui distinguerait, l'an prochain, des familles satisfaites de familles qui ne viennent plus en réunion — ou qui ne se sont pas réinscrites ?"
    origin: council:sceptique
    ask_to: SH-01
    action: entretien
    blocking: false
    status: ouverte
    resolution: ""
    related: ["success_signals", H-015, SRC-036, ZO-024]
    note: "MET EN CAUSE UNE VALIDATION : SH-01 a confirmé ce signal le 2026-10-28 (SRC-036). La validation n'est pas retirée ; la faiblesse lui a été montrée, et il y a répondu (SRC-037) : le contrôle est la réinscription elle-même. D'où un quatrième signal, chiffrable, et ZO-104 pour son dénominateur. RÉSIDU NON COUVERT : une famille primo-inscrite qui renonce après un dossier perdu n'apparaît ni en réunion ni dans le compte des réinscriptions."
  - id: ZO-102
    type: probleme_flou
    question: "RG-006 fait dépendre l'ouverture du bureau de la présence d'élèves. Une famille qui s'inscrit pour la première fois n'a pas encore d'enfant qui vient : à quelles heures peut-elle déposer son dossier, et que fait celle dont les parents travaillent sur ces créneaux ?"
    origin: council:utilisateur-final
    ask_to: SH-03
    action: entretien
    blocking: false
    status: ouverte
    resolution: ""
    related: [RG-006, R-03, SH-06, BC-002]
  - id: ZO-103
    type: hypothese_non_verifiee
    question: "Parmi les quelque 150 familles, lesquelles ont aujourd'hui du mal à remplir le dossier elles-mêmes — langue, lecture et écriture, vue, pas d'ordinateur ni d'imprimante — et comment font-elles ? Tout le dossier suppose une famille capable de relire et de corriger seule."
    origin: council:utilisateur-final
    ask_to: SH-03
    action: entretien
    blocking: false
    status: levée
    related: [BC-001, BC-009, SH-06, ZO-049, SRC-046]
    resolution: "LEVÉE. L'association affirme que toutes les familles peuvent remplir et corriger seules (SRC-046), et SH-03, qui reçoit les dossiers, le confirme par la nature des incomplétudes : « généralement c'est des oublis, doc pas signé, oublié du numéro de sécu » (SRC-047) — des omissions, pas des incapacités. La réserve subsiste en une ligne, non bloquante : une famille aidée chez elle ne laisse pas de trace au bureau, et une seule famille a été entendue (R-06). ANCIENNE NOTE : l'association répond que toutes les familles peuvent remplir et corriger seules (SRC-046). C'est un quantificateur absolu, énoncé par ceux qui reçoivent les dossiers et non par les familles — et une famille qui se fait aider chez elle ne laisse aucune trace au bureau. La zone reste ouverte sur les exceptions, et un indice existe déjà dans le dossier : les dossiers incomplets (ZO-025)."
  - id: ZO-098
    type: probleme_flou
    question: "À la première campagne du nouveau dispositif, d'où viendraient les informations des 135 familles déjà inscrites — reprises depuis les dossiers papier, depuis le fichier Excel du bureau, ou redonnées une fois de plus par les familles ? Si elles sont redonnées, aucune famille ne constate de gain la première année, celle où tout le monde regarde."
    origin: SRC-035
    ask_to: SH-02
    action: decision
    blocking: false
    status: ouverte
    resolution: ""
    related: [H-021, BC-001, BC-009, ZO-026, SRC-004]
  - id: ZO-097
    type: hypothese_non_verifiee
    question: "L'association pose que l'exactitude des informations de santé engage le parent et non elle (SRC-034). Or c'est elle qui remet le dossier aux médecins des urgences (RG-005). Cette position est-elle écrite quelque part — règlement, mention signée sur le dossier — et a-t-elle été établie avec quelqu'un dont c'est le métier ?"
    origin: SRC-034
    ask_to: SH-02
    action: document
    blocking: false
    status: ouverte
    resolution: ""
    related: [R-01, RG-005, BC-008, DD-02, ZO-030]
  - id: ZO-096
    type: probleme_flou
    question: "« Le bureau reste ouvert » : la porte est déverrouillée, ou quelqu'un s'y tient ? Et combien de temps faut-il pour retrouver le dossier d'un enfant parmi les quelque cent cinquante, par quelqu'un qui n'y range jamais rien — un enseignant ?"
    origin: SRC-032
    ask_to: SH-03
    action: entretien
    blocking: false
