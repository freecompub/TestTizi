#    rationale: ""         # pourquoi elle existe ; à challenger si personne ne le sait
#    exceptions: []        # chaque exception est elle-même une règle : RG-xxx
#    status: proposé       # proposé | validé | abandonné
#    lint_waivers: []

decisions:
  - id: DD-07
    question: "Par quel canal l'association répond-elle à une famille pendant la campagne, puisque le choix appartient aujourd'hui à celui qui traite le dossier (ZO-116) ?"
    zone: ZO-116
    options:
      - { text: "Un canal unique annoncé aux familles", impacts: "La famille sait où regarder et l'absence de message devient un signal ; le bureau perd la souplesse de répondre par le canal qu'il a sous la main" }
      - { text: "La famille choisit son canal à l'inscription", impacts: "Chaque famille est joignable là où elle regarde ; le bureau tient deux canaux en parallèle pendant toute la campagne" }
      - { text: "Le choix reste à celui qui traite", impacts: "Rien ne change pour le bureau ; le deuxième critère de BR-006 devient intenable" }
    decision: "WhatsApp est le canal prioritaire de réponse à une famille."
    rationale: "Rendue par SH-02 le 2026-10-28, hors des options proposées : « la priorité c'est WhatsApp ». Elle fait de WhatsApp le canal par défaut sans le rendre exclusif. Deux conséquences non traitées : le cas d'une famille sans WhatsApp, et le fait que le règlement signé impose l'écrit avec la Direction sans jamais mentionner WhatsApp (ZO-039) — ce qui n'est plus une dérive de pratique mais un choix délibéré, à écrire dans le règlement révisé (TR-01)."
    decided_by: SH-02
    date: "2026-10-28"
    status: validé
  - id: DD-06
    question: "Qu'est-ce qui fait qu'une famille est « attendue » au sens de BR-009, et doit donc être relancée si son dossier n'arrive pas ?"
    zone: ""
    options:
      - { text: "Celles de la liste de l'an dernier", impacts: "La relance couvre les réinscriptions, comme aujourd'hui ; les primo-inscriptions ne sont attendues par personne et OBJ-02 n'est tenu que pour une partie des familles" }
      - { text: "La liste, plus celles qui ont payé", impacts: "Le virement devient officiellement la preuve qu'une famille existe, et le paiement étant échelonné dès avril la trace arrive tôt ; une famille qui dépose avant de payer reste invisible jusqu'à son premier virement" }
      - { text: "Toute famille qui s'est manifestée", impacts: "Couvre tout le monde, mais suppose de garder une trace de chaque premier contact, ce qui n'existe nulle part aujourd'hui" }
    decision: "Est attendue toute famille figurant sur la liste de la campagne précédente, ainsi que toute famille dont un paiement a été reçu."
    rationale: "Rendue par SH-02 le 2026-10-28. Elle fait du virement, jusqu'ici filet accidentel découvert par le comptable au bilan de juillet (SRC-015), la définition officielle de l'existence d'une famille — et l'échelonnement du paiement dès avril (SRC-044) fait arriver cette trace tôt dans la campagne. Angle résiduel énoncé au moment du choix et non traité : ZO-109."
    decided_by: SH-02
    date: "2026-10-28"
    status: validé
  - id: DD-05
    question: "L'article 7 du règlement interdit tout remboursement sans exception, alors que l'association en a accordé un à juste titre. Le règlement étant rouvert, que devient cette règle (ZO-079) ?"
    zone: ZO-079
    options:
      - { text: "La réécrire avec l'exception", impacts: "L'association cesse d'agir hors de son propre règlement quand elle répare son erreur ; la famille gagne un droit écrit qu'elle n'avait pas, et pourra s'en prévaloir" }
      - { text: "La garder telle quelle", impacts: "Chaque remboursement reste une faveur au cas par cas, jamais un dû ; l'association garde la main entière et reste en tort chaque fois qu'elle rembourse" }
    decision: "Réécrire l'article 7 avec l'exception : aucun remboursement, sauf lorsque l'erreur n'incombe pas à la famille."
    rationale: "Rendue en séance le 2026-10-28 (SRC-045), à l'occasion de la révision du règlement décidée en DD-04. La raison d'être de la règle d'origine n'a jamais pu être établie, demandée deux fois : c'est l'étape 2 bis qui prescrit alors de demander si la règle est encore valable plutôt que de la reconduire sans la comprendre."
    decided_by: SH-02
    date: "2026-10-28"
    status: validé
  - id: DD-04
    question: "Le dossier signé annonce un règlement en trois fois avec chèques différés, alors que la pratique est le virement pour tous (ZO-082). Faut-il corriger le texte ou élargir la pratique ?"
    zone: ZO-082
    options:
      - { text: "Corriger le texte", impacts: "Le règlement dit enfin ce qui se passe ; les familles qui comptaient sur le paiement en trois fois par chèque perdent une facilité qu'on leur avait annoncée par écrit" }
      - { text: "Élargir la pratique aux chèques", impacts: "Le texte signé est honoré ; le filet de détection par les virements (RG-003, BR-009) ne couvre plus toutes les inscriptions" }
    decision: "Corriger le texte : le règlement intérieur va être révisé, et le paiement par chèque en disparaît."
    rationale: "Rendue en séance le 2026-10-28 (SRC-043). Conséquence non discutée : le paiement en trois fois disparaît du texte en même temps que les chèques, or c'était une facilité annoncée aux familles — ZO-108."
    decided_by: SH-02
    date: "2026-10-28"
    status: validé
  - id: DD-03
    question: "Si tout n'est pas prêt pour la campagne d'avril, quelle population l'association sert-elle en premier : les quelque 135 familles qui se réinscrivent, ou les 10 à 15 qui s'inscrivent pour la première fois ?"
    zone: ZO-100
    options:
      - { text: "Les réinscriptions d'abord", impacts: "135 familles cessent de tout réécrire ; les primo-inscrites restent exposées une campagne de plus à la perte de dossier (R-03), et aucun signal de succès ne les couvre" }
      - { text: "Les primo-inscriptions d'abord", impacts: "Le cas grave est traité ; les 135 continuent de tout réécrire et l'agacement déclencheur reste intact en avril" }
      - { text: "Les deux, sans priorité", impacts: "Rien n'est garanti pour avril ; si le temps manque, l'arbitrage se fera par les circonstances" }
    decision: "Les deux, sans priorité : aucune des deux populations ne passe avant l'autre."
    rationale: "Rendue par SH-02, décideur sur le périmètre et les priorités. Conséquence acceptée et énoncée au moment du choix : si le temps manque avant avril, la répartition se fera par les circonstances et non par une décision — d'où R-05."
    decided_by: SH-02
    date: "2026-10-28"
    status: validé
  - id: DD-02
    question: "Traiter les obligations liées aux données de santé de mineurs, aux consentements et aux coordonnées de tiers fait-il partie de cette initiative ?"
    zone: ZO-028
    options:
      - { text: "Oui, dans le périmètre", impacts: "Le périmètre s'élargit et la campagne d'avril devient plus difficile à tenir ; on ne reconstruit pas une procédure à reprendre ensuite" }
      - { text: "Non, traité à part", impacts: "Avril reste tenable ; la contrainte est inscrite comme risque assumé" }
      - { text: "Seulement ne pas aggraver", impacts: "Contrainte minimale, sans objectif de conformité ; reste à définir ce que « ne pas aggraver » veut dire" }
      - { text: "Décision à remonter au bureau ou à l'AG", impacts: "La zone reste ouverte et le calendrier de l'instance devient une contrainte" }
    decision: "Oui : le traitement des obligations liées aux données de santé, aux consentements et aux données de tiers fait partie du périmètre de l'initiative."
    rationale: "Rendue en réponse à une question de périmètre adressée à SH-02. Conséquence acceptée : le périmètre s'élargit alors que l'échéance d'avril est inchangée."
    decided_by: SH-02
    date: "2026-10-28"
    status: validé
  - id: DD-01
    question: "Les deux initiatives partagent un fichier (nom, prénom, téléphones) et un canal (WhatsApp). Où passe la frontière entre Inscriptions et Communication ?"
    zone: ZO-034
    options:
      - { text: "La liste des familles reste aux Inscriptions, Communication s'en sert", impacts: "Communication dépend d'Inscriptions et ne peut pas livrer avant elle ; l'échéance d'avril devient celle des deux" }
      - { text: "La liste devient une troisième initiative", impacts: "Les deux autres en dépendent ; un dossier de plus à tenir" }
      - { text: "Refusionner les deux initiatives", impacts: "Inscriptions, qui porte la preuve et l'échéance, avancerait au rythme de Communication, qui n'a ni l'une ni l'autre" }
      - { text: "Frontière au message", impacts: "Nette côté usage, mais les deux écriraient dans la même liste de familles" }
    decision: "La liste des familles reste dans l'initiative Inscriptions ; Communication s'en sert."
    rationale: "Rendue en réponse à une question adressée à SH-02 sur le périmètre. Réserve levée le 2026-10-28 : SH-02 a confirmé être président de l'association et avoir ce pouvoir (SRC-017)."
    decided_by: SH-02
    date: "2026-10-27"
    status: validé
