  - id: ZO-105
    type: succes_non_mesurable
    question: "Comment saurait-on qu'OBJ-03 est tenu ? Les trois protections qu'il vise — autorisations opposables, informations médicales disponibles sur place, dossier remis aux urgences — n'ont jamais été exercées : la chaîne d'urgence n'a jamais servi (SRC-029) et aucune autorisation n'a jamais été invoquée (ZO-088). Un objectif dont rien ne mesure l'atteinte se déclare tenu par défaut, jusqu'au jour où il ne l'est pas."
