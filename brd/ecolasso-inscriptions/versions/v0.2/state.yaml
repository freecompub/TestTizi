business_requirements:
  - id: BR-017
    statement: "L'association doit pouvoir recevoir une pièce ou une information manquante sans que la famille se déplace."
    objectives: [OBJ-01, OBJ-02]
    from_needs: [BC-014]
    business_rules: []
    acceptance:
      - "Pour chacune des pièces du dossier, il est établi si sa remise exige une présence physique, et pourquoi"
      - "Une pièce dont la remise n'exige pas de présence physique peut parvenir au bureau sans déplacement"
      - "Une famille à qui il manque une pièce apprend du même coup comment la remettre"
    priority: must          # validé par SH-02 le 2026-10-28
    rationale: "L'aller-retour est le premier irritant nommé par la seule famille entendue, et le déclencheur visait « la lourdeur des formulaires ET de la procédure ». Sans cette exigence, BR-007 peut être tenue à la lettre en laissant la procédure intacte. Le précédent existe déjà : la preuve de virement voyage par message (SRC-052)."
    status: validé
    validated_by: SH-02
    validated_on: "2026-10-28"
    lint_waivers:
      - { rule: S84, reason: "Assumé par SH-02 le 2026-10-28. Les trois documents de retour à la source sont écrits (interviews/retour-SH-01.md, retour-SH-02.md, retour-SH-03.md) et les sources concernées sont marquées envoyé ; leur relecture est reportée, pas abandonnée. La faiblesse suit le document : les relecteurs de la revue la verront." }
      - { rule: L03, reason: "Le « ou » de « une pièce ou une information » désigne les deux formes que prend un manque dans un dossier — un document absent, une case vide — et non deux exigences. Tom les a citées ensemble : « doc pas signé, oublié du numéro de sécu » (SRC-047)." }
  - id: BR-014
    statement: "L'association doit pouvoir établir, pour chaque information qu'elle détient sur un enfant ou sa famille, la raison pour laquelle elle la détient et la durée pendant laquelle elle la garde."
    objectives: [OBJ-04]
    from_needs: [BC-011]
    business_rules: []
    acceptance:
      - "Chacune des rubriques du dossier porte la raison pour laquelle elle est demandée et la durée pendant laquelle elle est gardée"
      - "Une rubrique dont personne ne réclame la raison est soumise à décision : la garder ou cesser de la demander"
      - "La durée de conservation d'une information reprise d'une campagne à l'autre est établie avant la première reprise"
    priority: should        # validé par SH-02 le 2026-10-28
    rationale: "Condition de BR-001 et BR-002, qui imposent de conserver ce que le papier faisait redonner : on ne garde pas une information sans savoir pourquoi ni combien de temps."
    status: validé
    validated_by: SH-02
    validated_on: "2026-10-28"
    lint_waivers:
      - { rule: L03, reason: "Le « ou » de « un enfant ou sa famille » désigne les personnes concernées, pas deux exigences : le dossier porte des informations sur l'enfant et sur ses parents, et la même obligation vaut pour les deux." }
  - id: BR-015
    statement: "L'association doit pouvoir limiter la lecture des informations de santé d'un enfant aux personnes qui en ont besoin."
    objectives: [OBJ-04, OBJ-03]
    from_needs: [BC-012]
    business_rules: []
    acceptance:
      - "Pour chaque rubrique de santé, les personnes autorisées à la lire sont établies"
      - "L'accès ouvert par BR-011 à la personne présente auprès de l'enfant ne donne pas accès aux dossiers des enfants dont elle n'a pas la charge"
      - "Le dispositif actuel est connu : qui peut aujourd'hui ouvrir un dossier au bureau"
    priority: must          # validé par SH-02 le 2026-10-28
    rationale: "C'est la borne de BR-011, déjà validée sans borne. L'accès est aujourd'hui réservé aux membres du bureau et un enseignant y entre déjà : le besoin existe sur le papier, avant tout changement."
    status: validé
    validated_by: SH-02
    validated_on: "2026-10-28"
    lint_waivers: []
  - id: BR-016
    statement: "L'association doit informer les familles de l'usage fait des informations qu'elles donnent et de la personne à qui s'adresser."
    objectives: [OBJ-04]
    from_needs: [BC-013]
    business_rules: []
    acceptance:
      - "Le dossier remis aux familles porte cette information"
      - "Les destinataires extérieurs à l'association y sont nommés, y compris le comptable et une équipe médicale en cas d'urgence"
      - "Une famille sait à qui demander l'accès à son dossier, sa correction ou sa suppression"
    priority: should        # validé par SH-02 le 2026-10-28
    rationale: "Porté par la révision du règlement (TR-01), qui est la fenêtre où ce texte peut entrer sans coût supplémentaire."
    status: validé
    validated_by: SH-02
    validated_on: "2026-10-28"
    lint_waivers:
      - { rule: L03, reason: "Le « et » relie les deux éléments d'une seule mention remise à la famille. Les scinder produirait deux exigences qui se livrent ensemble ou pas du tout." }
  - id: BR-013
    statement: "L'association doit pouvoir empêcher qu'un dossier soit déposé incomplet."
    objectives: [OBJ-01, OBJ-02]
    from_needs: [BC-010]
    business_rules: []
    acceptance:
      - "La liste des informations et des pièces obligatoires est établie et connue de la famille au moment où elle remplit"
      - "Une information obligatoire manquante est signalée à la famille avant que le dossier soit considéré comme déposé"
      - "Le nombre de dossiers déposés incomplets est connu, campagne après campagne"
    priority: should        # validé par SH-02 le 2026-10-28
    rationale: "Supprime l'aller-retour à la source plutôt qu'en aval, mais suppose d'abord d'établir ce qui est obligatoire parmi les treize pièces (ZO-033), travail qui n'est pas fait. BR-007 couvre le cas en aval en attendant."
    status: validé
    validated_by: SH-02
    validated_on: "2026-10-28"
    lint_waivers:
      - { rule: S84, reason: "Assumé par SH-02 le 2026-10-28. Les trois documents de retour à la source sont écrits (interviews/retour-SH-01.md, retour-SH-02.md, retour-SH-03.md) et les sources concernées sont marquées envoyé ; leur relecture est reportée, pas abandonnée. La faiblesse suit le document : les relecteurs de la revue la verront." }
      - { rule: S84, reason: "Les deux sources de BC-010 n'ont pas encore été relues par leurs auteurs : le retour à la source est prévu avant la génération du BRD, pour les 47 sources du dossier." }
  - id: BR-010
    statement: "L'association doit disposer, pour chaque enfant, d'autorisations parentales opposables."
    objectives: [OBJ-03]
    from_needs: [BC-006]
    business_rules: []
    acceptance:
      - "Pour chaque autorisation, l'association peut établir qui l'a donnée, quand, et sur quel texte"
      - "Une famille peut retirer une autorisation, le retrait est daté, et l'association sait qu'il a eu lieu"
    priority: must          # validé par SH-02 le 2026-10-28
    rationale: "Protection existante : la perdre serait une régression, pas une fonctionnalité manquante."
    status: validé
    validated_by: SH-02   # « Ok je valide », 2026-10-28, sans prénom ; les exigences relèvent du domaine de décision de SH-02 (decision_rights)
    validated_on: "2026-10-28"
    lint_waivers:
      - { rule: S84, reason: "Assumé par SH-02 le 2026-10-28. Les trois documents de retour à la source sont écrits (interviews/retour-SH-01.md, retour-SH-02.md, retour-SH-03.md) et les sources concernées sont marquées envoyé ; leur relecture est reportée, pas abandonnée. La faiblesse suit le document : les relecteurs de la revue la verront." }
      - { rule: S63, reason: "Source unique assumée par SH-02 à la porte de synthèse du 2026-10-28 (robustesse faible, assumed) et reportée en R-07. La dérogation ne vaut que pour la source unique ; elle ne couvre ni S05 ni S84." }
  - id: BR-011
    statement: "L'association doit rendre les informations médicales d'un enfant accessibles à la personne qui en a la charge au moment où survient une urgence."
    objectives: [OBJ-03]
    from_needs: [BC-007]
    business_rules: [RG-004]
    acceptance:
      - "La personne présente auprès de l'enfant atteint les allergies et les contacts d'urgence sans quitter l'enfant"
