    ask_to: SH-03
    action: entretien
    blocking: false
    status: levée
    resolution: "Après le mois de juin (SRC-013), donc APRÈS la clôture de la campagne. La détection a lieu une fois passée la période où elle pourrait encore servir. Le délai exact reste à préciser : ZO-068."
    related: [R-03, H-014, BC-002]
  - id: ZO-066
