target_process:
  status: validé           # validé par SH-02 le 2026-10-28, impact organisationnel 4 réécrit à sa demande
  events:
    - { event: "L'association a ouvert la campagne et prévenu les familles attendues", actor: "membres du bureau", change: modifié, requirements: [BR-009] }
    - { event: "La famille déjà connue a revu les informations détenues sur son enfant et n'a redonné que ce qui avait changé", actor: "parent", change: modifié, requirements: [BR-001, BR-002, BR-005] }
    - { event: "La famille de plusieurs enfants n'a donné qu'une fois les informations communes à la fratrie", actor: "parent", change: modifié, requirements: [BR-003] }
    - { event: "La famille n'a fourni que les pièces dont l'information avait changé", actor: "parent", change: modifié, requirements: [BR-004] }
    - { event: "La famille a donné ses autorisations, et l'association a gardé trace de qui les a données, quand et sur quel texte", actor: "parent", change: modifié, requirements: [BR-010] }
    - { event: "La famille qui s'inscrivait pour la première fois a laissé un moyen de contact qui ne dépend pas du dossier déposé", actor: "parent", change: nouveau, requirements: [BR-008] }
    - { event: "Le paiement a été échelonné entre avril et juin, par virement", actor: "parent", change: inchangé, requirements: [] }
    - { event: "Un membre du bureau a vérifié les informations et le paiement", actor: "membre du bureau", change: inchangé, requirements: [] }
    - { event: "L'association a fait savoir à la famille que son dossier lui était parvenu", actor: "membre du bureau", change: modifié, requirements: [BR-006] }
    - { event: "Quand une pièce manquait, l'association a dit laquelle", actor: "membre du bureau", change: modifié, requirements: [BR-007] }
    - { event: "Avant la fin de la campagne, l'association a comparé les familles attendues et les dossiers reçus, et relancé celles qui manquaient", actor: "membres du bureau", change: nouveau, requirements: [BR-009] }
    - { event: "Le bilan de juillet a cessé d'être le moment où l'on découvre qu'un dossier manque", actor: "comptable", change: supprimé, requirements: [BR-009] }
    - { event: "En cas d'urgence, la personne présente auprès de l'enfant a atteint les allergies et les contacts sans quitter l'enfant", actor: "enseignant", change: modifié, requirements: [BR-011] }
    - { event: "Les informations de santé ont été confiées à l'équipe médicale sans que l'association en soit privée", actor: "enseignant", change: modifié, requirements: [BR-012] }
    - { event: "L'enseignant a alerté les parents, les services d'urgence et le directeur", actor: "enseignant", change: inchangé, requirements: [] }
  org_impacts:
    - "Le bureau relance désormais TOUTES les familles attendues, et non les seules réinscriptions : la relance s'ajoute à la charge de campagne des mêmes personnes, sur la même période (SRC-042). C'est le changement d'organisation le plus lourd du dispositif, et il tombe sur des bénévoles."
    - "Le comptable cesse d'être le mécanisme de détection d'un dossier manquant. Le bilan de juillet subsiste comme bilan ; il n'est plus l'alerte."
    - "L'enseignant atteint des informations de santé d'un mineur là où il se trouve. Qui peut lire quoi n'est pas établi (ZO-095), et l'enseignant n'a jamais été entendu (R-06)."
    - "La famille déjà connue change de geste : elle ne remplit plus, elle relit et corrige. L'association affirme que toutes les familles peuvent le faire seules (SRC-046). L'affirmation est enregistrée telle quelle ; elle vient du côté qui reçoit les dossiers, non des familles, dont une seule a été entendue (R-06)."
    - "Le règlement intérieur doit être révisé avant la campagne (TR-01) : c'est un préalable, pas un accompagnement."

risks:
  - id: R-08
    text: "À la première campagne, aucune famille déjà inscrite ne constate de gain si ses informations ne sont pas reprises de l'existant : il faut bien qu'elles entrent une première fois. Or c'est cette campagne-là que tout le monde regardera pour juger si l'effort valait la peine, et c'est là que les signaux de succès seront lus"
    origin: H-021
    related: [H-021, BC-001, BR-001, ZO-098, "success_signals"]
    likelihood: forte
    impact: moyen
    response: "Côté métier : décider avant la campagne si les informations des familles déjà inscrites sont reprises depuis les dossiers papier ou le fichier du bureau (ZO-098), ou annoncer aux familles que le gain porte sur la campagne suivante"
    status: validé        # registre validé en bloc par SH-02 le 2026-10-28
  - id: R-09
    text: "DD-01, qui laisse la liste des familles rattachée à cette initiative et rend l'initiative sœur dépendante d'elle, repose sur trois hypothèses jamais vérifiées : que les deux initiatives concernent les mêmes familles, qu'elles partagent le même canal, et que le fichier du bureau soit la matière dont la sœur a besoin. Deux hypothèses voisines sur ce même fichier ont déjà été infirmées en cours de cadrage"
    origin: "sceptique"
    related: [DD-01, H-002, H-004, H-011]
    likelihood: moyenne
    impact: fort
    response: "Côté métier : vérifier ces trois hypothèses au démarrage d'ecolasso-communication, avant que les deux initiatives ne s'engagent sur une liste commune"
    status: validé        # registre validé en bloc par SH-02 le 2026-10-28
  - id: R-06
    text: "Le dossier est construit sur trois voix de six. Les besoins qui touchent l'enseignement (BC-007) et la primo-inscription (BC-002, BC-005, BC-008) n'ont été confirmés par personne qui les vive, et la famille primo-inscrite — celle qui porte le risque grave — n'a jamais parlé. Un besoin mal posé se découvrira à l'usage, quand le coût de le reprendre aura changé d'ordre"
    origin: synthesis_check.couverture
    related: [SH-04, SH-06, SH-07, BC-002, BC-005, BC-007, BC-008, R-03, ZO-083]
    likelihood: forte
    impact: fort
    response: "Côté métier : entendre un enseignant et une famille qui s'est inscrite pour la première fois avant le passage au PRD. Les deux voix sont atteignables, et ce sont celles dont dépendent quatre exigences sur treize."
    status: validé        # registre validé en bloc par SH-02 le 2026-10-28
  - id: R-07
    text: "Les neuf besoins candidats reposent chacun sur une source unique. Toute exigence bâtie dessus héritera de cette fragilité, sans que rien ne la signale au moment de la rédiger"
    origin: synthesis_check.robustesse
    related: [BC-001, BC-002, BC-003, BC-004, BC-005, BC-006, BC-007, BC-008, BC-009]
    likelihood: moyenne
    impact: moyen
    response: "Côté métier : faire relire à chaque personne interrogée la synthèse de ce qu'elle a dit (retour à la source), puis recouper sur pièce les besoins qui portent un chiffre — volumes, dossiers incomplets, remboursements."
    status: validé        # registre validé en bloc par SH-02 le 2026-10-28
  - id: R-05
    text: "Aucune priorité n'étant fixée entre les deux populations (DD-03), un retard avant avril ne se répartira pas : il se subira. Les deux besoins sont de nature différente — un irritant fréquent pour 135 familles, un préjudice grave pour 10 à 15 — et sans ordre établi, c'est l'ordre d'arrivée des travaux qui tranchera, au moment où il sera trop tard pour en décider"
    origin: DD-03
    related: [DD-03, ZO-100, R-03, BC-001, BC-002, BC-005, ZO-099]
    likelihood: moyenne
    impact: moyen
    response: "Conséquence assumée de DD-03. Côté métier : rouvrir l'arbitrage dès que le calendrier se tend, pendant qu'il est encore possible de choisir — et non quand l'ordre d'arrivée des travaux aura décidé."
    status: validé        # registre validé en bloc par SH-02 le 2026-10-28
  - id: R-04
    text: "La voie de recours d'une famille se termine chez la personne dont la faute est précisément en cause : le parent conteste auprès d'un membre du bureau, qui remonte au président, qui tranche — et c'est l'association qu'il représente qui est mise en cause. Aucune instance tierce n'intervient, et la règle qui fonde la décision n'est écrite nulle part (RG-002, ZO-079)"
    origin: SRC-020
    related: [RG-002, ZO-077, ZO-078, SH-06]
    likelihood: faible
    impact: moyen
    response: "Le cumul présidence-direction chez SH-02 fait que la voie de recours d'une famille remonte à celui dont la décision est contestée. Côté métier : nommer dans le règlement révisé qui tranche un litige où la direction est en cause (TR-01)."
    status: validé        # registre validé en bloc par SH-02 le 2026-10-28
  - id: R-03
    text: "Une famille dont le dossier est perdu ou incomplet n'est pas prévenue. Si elle ne prend pas d'elle-même l'initiative de contacter le bureau, l'enfant peut perdre sa place. La charge de détecter la défaillance repose entièrement sur celui qui la subit, et la sanction porte sur l'enfant"
    origin: SRC-009
    related: [BC-002, ZO-053, ZO-057, SH-06]
    likelihood: forte        # « ça arrive de temps à autre » (SRC-023 relu avec SRC-024) : récurrent, non chiffré — et sur une population de 10 à 15 primo-inscriptions par an (SRC-023), pas sur 150
    impact: fort          # un enfant perd sa place pour l'année
    mechanism_note: "Confirmé une seconde fois le 2026-10-28 : tous les moyens de contact d'une famille vivent dans le formulaire (SRC-050). La perte du dossier emporte donc à la fois l'inscription et le moyen de prévenir la famille qu'elle est perdue. C'est une défaillance unique, pas deux."
    response: "La chaîne de rattrapage existe et fonctionne (SRC-015) ; elle casse au seul endroit où la famille n'est joignable que par le dossier perdu. Le besoin métier correspondant est BC-005. Aucun moyen n'est préconisé ici"   # la piste « avancer le rapprochement » a été retirée : SRC-014 établit qu'il a lieu début juillet, soit deux mois avant la rentrée. Le levier est ailleurs — dans ce qui suit la détection (ZO-069)
    status: validé        # registre validé en bloc par SH-02 le 2026-10-28
    note: "CONFIRMÉ par SH-03 (SRC-010) : c'est arrivé. SH-03 le dit concentré sur les nouveaux inscrits, mais le seul cas qu'il cite est une RÉINSCRIPTION (SRC-011) : contradiction ZO-063. Le parent avait déposé en juin et PAYÉ ; l'association a dû rembourser en septembre."
  - id: R-02
    text: "En situation d'urgence, la personne présente auprès de l'enfant — l'enseignant — n'a pas les allergies ni les contacts sous les yeux : ils sont sur un dossier papier rangé au bureau, et il doit quitter l'enfant pour aller le chercher. Les quatre rubriques de santé ne sont consultables qu'ailleurs, au moment précis où elles servent"
    correction: "2026-10-28 — formulation corrigée. La version précédente affirmait que l'enseignant « doit joindre un membre du bureau qui, lui, y a accès » : c'est FAUX. SRC-031 établit que l'enseignant va lui-même prendre le dossier au bureau. Ce n'était pas une parole de source, c'était une déduction de l'agent. Le risque subsiste — l'information n'est pas là où est l'enfant — mais il tient à la distance, pas à un intermédiaire"
    origin: ZO-031
    related: [SRC-002, SH-04, BC-007, ZO-090]
    likelihood: faible      # jamais survenu à la connaissance du répondant de SRC-029 — mais la seule personne qui le saurait, un enseignant, n'a jamais été entendue (H-020)
    impact: fort
    response: "Jamais survenu à ce jour, mais la seule personne qui le saurait — un enseignant — n'a jamais été entendue (H-020). Traité par BR-011 ; à confronter à la parole d'un enseignant avant le PRD."
    status: validé        # registre validé en bloc par SH-02 le 2026-10-28
  - id: R-01
    text: "Reporter automatiquement les informations d'une année sur l'autre peut laisser une donnée de santé périmée dans le dossier : une allergie apparue, un vaccin fait, un médecin traitant changé. Aujourd'hui, la ressaisie intégrale force une relecture annuelle de ces informations — personne ne l'a voulu ainsi, mais c'est un effet du papier"
    origin: BC-001
    related: [SRC-002, ZO-030, BC-009, ZO-097]
    likelihood: moyenne
    impact: fort
    response: "Traité par BR-002, qui rend la relecture annuelle obligatoire : une réinscription ne peut s'achever sans que la famille ait eu les rubriques de santé sous les yeux. Le parent lui-même a posé cette limite (BC-009)."
    status: validé        # registre validé en bloc par SH-02 le 2026-10-28
