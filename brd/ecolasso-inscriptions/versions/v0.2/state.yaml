problem:
  statement: |
    Chaque année, 10 à 15 familles s'inscrivent pour la première fois et environ 135 se réinscrivent,
    toutes sur un dossier papier de treize pièces déposé au bureau entre avril et juin.
    Les familles qui reviennent réécrivent des informations que l'association détient déjà, autant de
    fois qu'elles ont d'enfants, et vont rechercher chez elles des pièces qui n'ont pas changé.
    Pour les familles qui arrivent, le dossier déposé est le seul enregistrement de leur existence :
    quand il se perd — ce qui arrive de temps à autre — rien ne le signale à la famille, et l'enfant
    peut perdre sa place.
  confirmed: true
  confirmed_by: SH-02    # le sponsor, président et directeur : « Oui Dédé confirme », 2026-10-28
  confirmed_on: "2026-10-28"
  symptoms:
    - { text: "Les parents expriment leur agacement en réunion sur la lourdeur du formulaire et de la procédure — c'est le déclencheur de l'initiative", source: SRC-006 }
    - { text: "Onze rubriques sur douze ne changent pas d'une année sur l'autre, et sont pourtant réécrites intégralement", source: SRC-002 }
    - { text: "Un parent de deux enfants remplit deux fois les mêmes informations dans la même campagne : « le plus pénible »", source: SRC-008 }
    - { text: "Les familles ressortent des pièces inchangées — le carnet de vaccination d'un adolescent", source: SRC-008 }
    - { text: "Aucun suivi n'est offert aux familles : pour connaître l'état de son dossier, il faut aller chercher le bureau", source: SRC-010 }
    - { text: "Une place d'enfant a été perdue et l'inscription remboursée : le dossier avait disparu et la famille, nouvelle, n'était joignable que par ce dossier", source: SRC-011 }
    - { text: "L'écart n'est vu qu'au bilan de début juillet, par le comptable, à partir des virements reçus — la seule trace qui survive à la perte du dossier", source: SRC-015 }
  impact:
    - { type: risque, text: "Pour une famille primo-inscrite dont le dossier se perd, l'association n'a aucun moyen de la joindre : « sinon on peut rien faire ». 10 à 15 familles exposées par campagne", source: SRC-015 }
    - { type: qualite, text: "La relation avec les familles est le motif premier : « on ne veut plus avoir de problèmes avec les parents »", source: SRC-006 }
    - { type: cout, text: "Un remboursement d'inscription constaté, en septembre, hors de toute règle écrite (RG-001 ne prévoit aucun remboursement). Volume des campagnes précédentes non établi : ZO-084", source: SRC-011 }

success_signals:
  - text: "Des inscriptions qui aboutissent sans problème"
    measurable: false      # ni définition de « sans problème », ni valeur actuelle : ZO-024, ZO-026
  - text: "Moins de dossiers incomplets"
    measurable: false      # ni définition de « incomplet », ni valeur actuelle : ZO-025 — alors que le fichier Excel du bureau porte un statut d'inscription (SRC-004), qui pourrait en tenir le compte
    source: SRC-001
    note: "Énoncé deux fois, à deux moments distincts (SRC-001, puis SRC-038) : c'est le seul élément du dossier qui ait été redit spontanément. Ce qui lui manque n'est pas l'adhésion mais la définition et la valeur de départ."
  - text: "La part des familles qui se réinscrivent d'une année sur l'autre ne baisse pas"
    measurable: true       # PROPOSÉ le 2026-10-28 à partir de SRC-037, non confirmé. Numérateur connu (environ 135) ; dénominateur à établir : ZO-104
    source: SRC-037
    note: "Le premier signal potentiellement chiffrable du dossier, et le garde-fou du suivant : il distingue « plus d'agacement parce que ça va mieux » de « plus d'agacement parce qu'elles sont parties » (ZO-101). Il ne couvre PAS les familles primo-inscrites qui renoncent : celles-là ne sont ni en réunion ni dans le compte des réinscriptions (R-03)."
  - text: "En réunion, les familles n'expriment plus d'agacement sur la lourdeur de l'inscription"
    measurable: false      # observable mais non chiffré : ni définition de « agacement », ni valeur actuelle (ZO-024)
    confirmed_by: SH-01    # « Oui c'est un bon signal », 2026-10-28 (SRC-036)
    source: SRC-035
    note: "Premier signal pris du côté des familles, et le seul confirmé par une famille. Il est le symétrique exact du déclencheur de l'initiative (SRC-006 : l'agacement exprimé en réunion), donc observable là où le problème a été constaté, et les comptes rendus de réunion (ZO-021) en porteraient la trace. SH-01 n'a pas donné de signal observable : il a donné une solution et une promesse (ZO-026 reste ouverte)."


scope:                     # CONFIRMÉ par SH-02 le 2026-10-28
  in:
    - "Les inscriptions et les réinscriptions des enfants, de l'ouverture de la campagne à sa clôture"
    - "Le contenu du dossier d'inscription : les informations et les pièces demandées aux familles, et ce qui est réellement obligatoire parmi elles"
    - "L'information de la famille sur l'état de son dossier : réception, incomplétude, validation"
    - "La capacité de joindre une famille indépendamment du dossier qu'elle a déposé"
    - "La liste des familles et des enfants inscrits, qui reste rattachée à cette initiative (DD-01)"
    - "Les obligations liées aux données de santé de mineurs, aux consentements et aux coordonnées de tiers portées par le dossier (DD-02)"
    - "L'accès aux informations de santé d'un enfant en situation d'urgence, et leur remise à une équipe médicale extérieure"
    - "La révision du règlement intérieur, comme préalable à la campagne et non comme accompagnement (TR-01)"
  out:
    - "La communication courante entre parents, enseignants et élèves, et les groupes WhatsApp : initiative sœur ecolasso-communication"
    - "L'affectation des élèves aux cours et aux groupes, le nombre de places et les listes d'attente : jamais instruit sur ce dossier, et sans lien avec le problème confirmé"
    - "La comptabilité de l'association et sa relation avec le comptable extérieur, hors de ce que celle-ci apporte à la détection d'un dossier manquant"
    - "Les modalités pédagogiques des cours en distanciel ; seuls les consentements que le distanciel met en jeu restent dans le périmètre (DD-02)"
    - "Le choix d'un outil, d'une technologie ou d'une forme de dossier : cela relève des étapes suivantes, pas du besoin métier"
  deadline: "campagne d'inscription d'avril 2027"   # invoquée dans DD-01, DD-02, DD-03 et les trois objectifs, mais rattachée à aucun fait daté : ZO-099

current_process:
  events:
    - { event: "Trois membres du bureau tiennent la campagne ; valider un dossier prend environ dix minutes", actor: "membres du bureau", source: SRC-049 }
    - { event: "Les relances se font par mail, et elles coûtent plus de temps que la validation elle-même", actor: "membres du bureau", source: SRC-049 }
    - { event: "Quand une pièce manque, le parent revient au bureau la déposer — sauf la preuve de virement, qu'il peut envoyer par WhatsApp", actor: "parent", source: SRC-052 }
    - { event: "Le paiement de l'inscription est échelonné entre avril et juin, sur la durée de la campagne", actor: "parent", source: SRC-044 }
    - { event: "Le parent dépose le dossier papier au bureau", actor: "parent", source: SRC-001 }
    - { event: "Un membre du bureau prend le dossier", actor: "membre du bureau", source: SRC-004 }
    - { event: "Il vérifie les données saisies et le paiement", actor: "membre du bureau", source: SRC-004 }
    - { event: "Si tout est correct, il envoie un message WhatsApp de validation", actor: "membre du bureau", source: SRC-004 }
    - { event: "Sinon, il envoie un message listant les données manquantes", actor: "membre du bureau", source: SRC-004 }
    - { event: "Le parent se déplace à nouveau au bureau pour corriger", actor: "parent", source: SRC-004 }
    - { event: "DÉBUT JUILLET, à la fin des inscriptions, le bilan rapproche les virements reçus des dossiers déposés", actor: "membre du bureau", source: SRC-014 }
    - { event: "Le COMPTABLE remonte l'écart au bureau", actor: "comptable (SH-07)", source: SRC-015 }
    - { event: "Pendant la campagne, les membres du bureau relancent les familles attendues dont ils ont les coordonnées — c'est-à-dire les réinscriptions ; une famille primo-inscrite n'est relançable par personne", actor: "membres du bureau", source: SRC-042 }
    - { event: "Le bureau recherche le dossier", actor: "membre du bureau", source: SRC-015 }
    - { event: "S'il le trouve : il valide l'inscription", actor: "membre du bureau", source: SRC-015 }
    - { event: "S'il ne le trouve pas : il contacte les parents — mais pour une nouvelle famille, les coordonnées n'existaient que dans le dossier perdu. « Sinon on peut rien faire »", actor: "membre du bureau", source: SRC-015 }
    - { event: "Quand un dossier pose problème et que le numéro de téléphone est disponible, le bureau appelle la famille", actor: "membre du bureau", source: SRC-012 }
    - { event: "Un fichier Excel tient le statut des dossiers ; le bureau l'y consulte pour savoir si un dossier est « ok ou non ». Le moment où il est rempli n'est pas établi (ZO-045)", actor: "membre du bureau", source: SRC-004 }
  # reconstitué en Discover (atelier, entretiens)
