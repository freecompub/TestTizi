    reason: ""
    notes: "Attendu implicite au sens de Kano : jamais cité en six échanges sur les inscriptions, et cité en premier dès qu'on a demandé l'évident (ZO-008). Ce n'est pas la signature qui est le besoin — c'est la couverture ; la signature est le moyen actuel. Le dossier (SRC-003) porte au moins l'autorisation de transport en urgence et l'autorisation de diffusion média. Quelles autorisations exactement, et l'association a-t-elle déjà eu à s'en prévaloir : ZO-088."
  - id: BC-007
    text: "Disposer des informations médicales d'un enfant au moment et à l'endroit où une urgence survient"
