    status: intégré
    reason: ""
    notes: "Besoin resté sans porteur : DD-02 a mis ces obligations dans le périmètre le 2026-10-28 et aucun objectif ni aucune exigence ne les reprenait (ZO-110). D'autant plus exigible que BR-001 et BR-002 imposent désormais de CONSERVER d'une campagne à l'autre ce que le papier faisait redonner (ZO-106)."
  - id: BC-012
    text: "Pouvoir limiter la lecture des informations de santé d'un enfant à ceux qui en ont besoin, au moment où ils en ont besoin"
    sources:
      - { ref: SRC-048, location: "DD-02 : les obligations sur les données entrent dans le périmètre" }
      - { ref: SRC-031, location: "un enseignant entre au bureau et prend le dossier d'un enfant" }
    status: intégré
    reason: ""
    notes: "C'est la BORNE que BR-011 n'avait pas : BR-011 ouvre l'accès à « la personne présente auprès de l'enfant » sans dire où il s'arrête, alors que l'accès est aujourd'hui réservé aux membres du bureau. Le besoin existe déjà sur le papier : un enseignant entre au bureau et prend un dossier (SRC-031, ZO-095)."
  - id: BC-013
    text: "Pouvoir dire aux familles ce qui est fait des informations qu'elles donnent, et à qui s'adresser"
    sources:
      - { ref: SRC-048, location: "DD-02 : les obligations sur les données entrent dans le périmètre" }
      - { ref: SRC-025, location: "le comptable, extérieur à l'association, voit des informations nominatives de familles" }
    status: intégré
    reason: ""
    notes: "Le dossier remis aux familles ne porte aucune mention de ce genre (ZO-028, ZO-071). Et des informations sortent déjà : vers le comptable extérieur (ZO-086), et vers les médecins des urgences (RG-005, BR-012)."
  - id: BC-010
    text: "Pouvoir éviter qu'un dossier soit déposé incomplet"
    sources:
      - { ref: SRC-010, location: "« les irritants que j'ai les aller retour pour les inscriptions » — le parent qui revient corriger" }
      - { ref: SRC-047, location: "« généralement c'est des oublis, doc pas signé, oublié du numéro de sécu » — le bureau qui court après les pièces" }
    status: intégré
    reason: ""
    notes: "PREMIER BESOIN DU DOSSIER À DEUX SOURCES, et les deux bouts de la même chaîne : le parent subit l'aller-retour, le bureau le provoque. Distinct de BC-002 (savoir que le dossier est complet, après) : celui-ci porte sur l'instant du dépôt, avant. Suppose établi ce qui est obligatoire dans les treize pièces — ce qui ne l'est pas (ZO-033)."
  - id: BC-009
    text: "Pouvoir revoir et corriger chaque année les informations déjà détenues sans avoir à les réécrire"
