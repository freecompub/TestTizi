  - id: ZO-064
    type: probleme_flou
    question: "« Le dossier avait disparu, donc on n'a pas pu contacter le parent. » Pourquoi ? Le fichier Excel contient les téléphones des parents, et cette famille était déjà inscrite les années précédentes. Le fichier est-il recréé de zéro chaque année, comme les groupes WhatsApp — ou la ligne n'existe-t-elle qu'une fois le dossier traité ?"
