candidate_needs:
  - id: BC-014
    text: "Pouvoir compléter ou corriger un dossier sans retourner au bureau"
    sources:
      - { ref: SRC-009, location: "« les irritants que j'ai les aller retour pour les inscriptions » — le premier irritant nommé par la seule famille entendue" }
      - { ref: SRC-052, location: "« il revient au bureau. Pour la preuve de virement il peut l'envoyer par WhatsApp »" }
    status: intégré
    reason: ""
    notes: "Deuxième besoin du dossier à deux sources. Il comble le trou de ZO-112 : BR-007 fait APPRENDRE à la famille ce qui manque sans se déplacer, et rien ne dit comment elle le REMET — on pouvait donc tenir l'exigence à la lettre et laisser l'aller-retour entier. L'association a déjà un précédent : une pièce voyage par message. H-024 propose l'explication — c'est la signature qui retient, pas le papier."
