    resolution: "Personne ne compte sur la relecture annuelle. Pour SH-03 et SH-02, « ces informations engagent la responsabilité du parent, pas de l'association » (SRC-034) : la fraîcheur est posée comme le devoir du parent, pas comme un effet du processus qu'il faudrait préserver. SH-01, lui, sépare les deux actes que le papier confond : « d'accord pour la relecture, pas pour la ressaisie » (SRC-033) → BC-009, qui qualifie BC-001 et désamorce R-01. Reste ZO-097 : l'association remet pourtant ce dossier aux urgences (RG-005)."
    related: [BC-001, BC-009, R-01, ZO-097, RG-005]
  - id: ZO-028
    type: perimetre_flou
    question: "Données de santé de mineurs et consentements : qui est responsable de traitement dans l'association, où sont conservés les dossiers papier aujourd'hui, pendant combien de temps, et qui y a accès ? Et le traitement de ces obligations est-il dans le périmètre de l'initiative ou hors de lui ?"
    origin: SRC-002
    ask_to: SH-02
    action: decision
    blocking: false
    status: levée
    resolution: "DD-02 : c'est dans le périmètre. Les questions de fait qui restaient (responsable de traitement, lieu et durée de conservation, accès) deviennent des zones à instruire : ZO-071 à ZO-075."
    related: [BC-001]
  - id: ZO-029
    type: probleme_flou
    question: "Parmi les douze rubriques du dossier, lesquelles changent réellement d'une année sur l'autre ? Question posée, restée sans réponse — c'est elle qui sépare « tout réécrire » de « confirmer ce qui n'a pas bougé », donc elle dimensionne BC-001."
    origin: SRC-002
    ask_to: SH-01
    action: entretien
    blocking: false
    status: levée
    resolution: "Seule l'assurance scolaire change à coup sûr tous les ans. Le reste peut changer, mais rarement (SRC-001, SH-01). La ressaisie est donc redondante sur onze rubriques sur douze pour la plupart des familles."
    related: [BC-001]
  - id: ZO-024
    type: succes_non_mesurable
    question: "Qu'est-ce qu'une inscription « réussie sans problème » ? Et combien y en a-t-il aujourd'hui sur 150 ? Sans définition ni valeur de départ, l'indicateur ne pourra pas dire si quoi que ce soit s'est amélioré."
    origin: point-etape
    ask_to: SH-02
    action: question-utilisateur
    blocking: false
    status: ouverte
    resolution: ""
    related: []
  - id: ZO-025
    type: probleme_flou
    question: "Les « dossiers incomplets » n'avaient jamais été mentionnés : combien par campagne, à quoi reconnaît-on un dossier incomplet, et qui court après les pièces manquantes ? C'est un troisième mode de défaillance, distinct de la perte et de la ressaisie."
    origin: point-etape
    ask_to: SH-02
    action: entretien
    blocking: false
    status: ouverte
    resolution: ""
    related: [ZO-007]
  - id: ZO-026
    type: attendu_implicite
    question: "Les deux indicateurs proposés mesurent la réussite du côté de l'association (dossiers traités), aucun du côté des familles — alors que le déclencheur est leur agacement. Qu'est-ce qui dirait, côté parent, que ça s'est amélioré ?"
    origin: point-etape
    ask_to: SH-01
    action: entretien
    blocking: false
    status: levée
    resolution: "Un troisième signal existe désormais, du côté des familles : « en réunion, les familles n'expriment plus d'agacement sur la lourdeur de l'inscription », confirmé par SH-01 (SRC-036). Il est le symétrique du déclencheur (SRC-006). Il n'est pas chiffré — ni définition de l'agacement, ni valeur actuelle : ZO-024 reste ouverte. À noter que SH-01 interrogé directement n'a pas produit de signal observable (SRC-035) : il a donné une solution et une promesse. Le signal retenu est une proposition de l'agent qu'il a validée, pas une parole spontanée."
    related: [SRC-035, SRC-036, ZO-024, H-021]
  - id: ZO-027
    type: hypothese_non_verifiee
    question: "Que contient le règlement interne au sujet des inscriptions : pièces obligatoires, délais, validations, conditions de refus ? Document annoncé, à récupérer."
    origin: point-etape
    ask_to: SH-01
    action: document
    blocking: false
    status: levée
    resolution: "Le règlement intérieur est la page 5 du dossier lui-même (SRC-003), sept articles, avec signature obligatoire des parents. Il n'était donc pas à récupérer ailleurs. Il impose l'écrit pour les absences et la correspondance, et pose le non-remboursement des frais."
    related: []
  - id: ZO-023
    type: perimetre_flou
    question: "Le budget « quelques mois » a été annoncé pour l'ensemble, avant le découpage. Combien pour CETTE initiative ?"
    origin: cadrage
    ask_to: SH-02
    action: decision
    blocking: false
    status: ouverte
    resolution: ""
    related: []
