    action: entretien
    blocking: false
    status: levée
    resolution: "Le comptable (SH-07) remonte l'écart, le bureau cherche le dossier, le valide s'il le trouve, contacte les parents sinon. La procédure est saine et complète. Elle casse sur un seul point : pour une famille nouvelle, les coordonnées n'existaient que dans le dossier perdu — « sinon on peut rien faire » (SRC-015). D'où BC-005."
    related: [R-03, BC-002, ZO-067]
  - id: ZO-068
    type: probleme_flou
    question: "« Après le mois de juin » : combien de temps après ? Début juillet, à la rentrée, quand quelqu'un y pense ? Entre ces réponses, il y a la différence entre une place récupérable et une place perdue."
    origin: SRC-013
    ask_to: SH-03
    action: entretien
    blocking: false
    status: levée
    resolution: "Début juillet, à la fin des inscriptions (SRC-014). Le moment n'est donc PAS tardif : l'écart du cas de septembre était visible deux mois avant que la famille ne se présente. Ce qui manque n'est pas la détection ni son moment, mais ce qu'on en fait : ZO-069."
    related: [R-03, ZO-067]
  - id: ZO-067
    type: probleme_flou
    question: "À quel moment le rapprochement entre virements reçus et dossiers déposés est-il fait, par qui, et à quelle fréquence ? Dans le cas de septembre, l'argent était là depuis juin et l'écart n'a été vu qu'à la rentrée : si le rapprochement avait eu lieu en juillet, la place de l'enfant était encore disponible."
