  - id: ZO-061
    type: probleme_flou
    question: "Combien de NOUVELLES inscriptions par campagne, sur les 150 ? Et comment l'association saurait-elle qu'une famille a essayé puis disparu, puisque la seule trace de sa tentative était le dossier perdu (H-015) ?"
