    reason: ""
    notes: "Distinct de BC-007 : autre destinataire (une équipe médicale, hors association), autre moment (le transport), autre finalité (soigner, pas alerter). C'est la fonction du dossier papier la moins visible et la plus contraignante pour la suite : le dossier doit pouvoir QUITTER le bureau et être lu par quelqu'un qui n'appartient pas à l'association. Jamais exercé à ce jour (SRC-029)."
