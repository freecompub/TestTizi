    validated_on: "2026-10-28"
    lint_waivers:
      - { rule: S84, reason: "Assumé par SH-02 le 2026-10-28. Les trois documents de retour à la source sont écrits (interviews/retour-SH-01.md, retour-SH-02.md, retour-SH-03.md) et les sources concernées sont marquées envoyé ; leur relecture est reportée, pas abandonnée. La faiblesse suit le document : les relecteurs de la revue la verront." }
      - { rule: S63, reason: "Source unique assumée par SH-02 à la porte de synthèse du 2026-10-28 (robustesse faible, assumed) et reportée en R-07. La dérogation ne vaut que pour la source unique ; elle ne couvre ni S05 ni S84." }
