    indicator: "part des rubriques du dossier pour lesquelles la finalité, la durée de conservation et les personnes autorisées sont établies"
    baseline: "aucune : rien n'est établi aujourd'hui (ZO-028, ZO-071)"
    target: "toutes les rubriques du dossier"
    deadline: "campagne d'inscription d'avril 2027"
    owner: SH-02
    status: validé
    validated_by: SH-02
    validated_on: "2026-10-28"
    from_needs: [BC-011, BC-012, BC-013]
    lint_waivers: []
  - id: OBJ-01
    statement: "Une famille déjà connue de l'association ne redonne, pour se réinscrire, que ce qui a changé"
    indicator: "part des informations qu'une famille déjà inscrite doit redonner à la réinscription"
    baseline: "les douze rubriques du dossier sont redonnées intégralement, et autant de fois que la famille a d'enfants (SRC-002, SRC-008) — alors qu'une seule, l'assurance scolaire, change à coup sûr chaque année (ZO-029)"
    target: "seulement ce qui a changé ou doit être reconfirmé"
    deadline: "campagne d'inscription d'avril 2027"   # échéance invoquée mais non documentée : ZO-099
    owner: SH-02
    status: validé
    validated_by: SH-02   # « On valide les 3 », 2026-10-28, sans prénom ; les objectifs relèvent du domaine de décision de SH-02 (decision_rights)
    validated_on: "2026-10-28"
    from_needs: [BC-001, BC-003, BC-004, BC-009]
    lint_waivers: []
  - id: OBJ-02
    statement: "Aucun enfant ne perd sa place parce que son dossier a disparu sans que personne ne le dise"
    indicator: "part des écarts entre familles attendues et dossiers reçus qui sont résolus avant la clôture de juin"   # validé par SH-02 le 2026-10-28, en remplacement de l'indicateur aveugle (ZO-114)
    indicator_retire: "nombre de familles dont l'inscription échoue faute d'avoir pu être jointes — ABANDONNÉ : H-015 confirmée, une famille perdue qui ne revient pas ne laisse aucune trace, donc ce compte ne peut pas voir les cas qu'il prétend mesurer"
    baseline: "aucun écart n'est résolu avant la clôture : le rapprochement se fait début juillet (SRC-014), et le seul cas connu s'est soldé par un remboursement en septembre (SRC-011)"
    target: "tous les écarts résolus avant la clôture de juin"
    deadline: "campagne d'inscription d'avril 2027"
    owner: SH-02
    status: validé
    validated_by: SH-02   # « On valide les 3 », 2026-10-28, sans prénom ; les objectifs relèvent du domaine de décision de SH-02 (decision_rights)
