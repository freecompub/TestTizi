business_rules:
  - id: RG-007
    statement: "L'association doit répondre à une famille en priorité par WhatsApp."
    kind: comportement
    enforcement: derogation_autorisee   # un recours existe, mais ni son déclencheur ni qui l'autorise ne sont établis
    sources: [{ ref: SRC-051, location: "« la priorité c'est WhatsApp »" }]
    owner: SH-02
    rationale: "Canal réellement utilisé par l'association avec les familles, consacré par DD-07. Le mail existe en pratique pour les relances (SRC-049) : il devient le recours, sans que rien ne dise quand il s'applique."
    exceptions: []
    status: validé
    validated_by: SH-02   # validée le 2026-10-28, avec le critère ajouté à BR-006
    notes: "Deux trous ouverts : le cas d'une famille sans WhatsApp (ZO-049), et le fait que le règlement signé impose l'écrit avec la Direction sans jamais mentionner WhatsApp (ZO-039). Depuis DD-07, ce n'est plus une dérive : c'est une règle de l'association, et elle doit entrer dans le règlement révisé (TR-01)."
  - id: RG-006
    statement: "Le bureau doit rester ouvert tant que des élèves sont présents dans les locaux."
    rationale_proposed: "PROPOSÉ par l'agent le 2026-10-28, NON CONFIRMÉ : tant qu'un enfant est là, l'association en répond (SRC-031) ; quelqu'un doit donc pouvoir ouvrir, joindre et atteindre les dossiers."
    kind: comportement
    enforcement: stricte
    sources: [{ ref: SRC-032, location: "« Tant que il y des élèves, le bureau reste ouvert »" }]
    owner: SH-02
    rationale: ""
    exceptions: []
    status: validé
    validated_by: SH-02   # validées en bloc le 2026-10-28 ; RG-001 validée dans son texte actuel, sa raison d'être restant inconnue, et elle sera réécrite par DD-05
    notes: "C'est elle qui rend RG-005 exécutable : le dossier est atteignable à toute heure où un enfant est là. Reste ce que « ouvert » veut dire — porte déverrouillée, ou quelqu'un présent (ZO-096). La règle vaut aussi pour les cours en distanciel (Zoom, ZO-040) : là, l'enfant n'est pas dans les locaux et la règle ne dit rien."
  - id: RG-004
    statement: "En cas d'urgence médicale pendant un cours, l'enseignant doit alerter trois destinataires : les parents, les services d'urgence, le directeur."
    rationale_proposed: "PROPOSÉ par l'agent le 2026-10-28, NON CONFIRMÉ : l'enseignant est seul auprès de l'enfant et ne peut décider seul ; les trois appels couvrent les trois autorités qui doivent l'être — celle qui a l'autorité parentale, celle qui soigne, celle qui engage l'association."
    kind: comportement
    enforcement: stricte      # énoncée comme une obligation ; jamais appliquée à ce jour (SRC-029), donc jamais éprouvée
    sources: [{ ref: SRC-030, location: "« Les enseignants doivent appeler les parents, les urgences, le directeur »" }]
    owner: SH-02
    rationale: ""
    exceptions: []
    status: validé
    validated_by: SH-02   # validées en bloc le 2026-10-28 ; RG-001 validée dans son texte actuel, sa raison d'être restant inconnue, et elle sera réécrite par DD-05
    notes: "Deux trous ouverts en zones : la consigne n'est peut-être écrite nulle part (ZO-091) ; l'enseignant doit appeler les parents alors que R-02 dit qu'il n'a pas leurs coordonnées (ZO-092). L'ordre des trois appels n'est pas établi."
    lint_waivers:
      - { rule: L03, reason: "Les trois appels sont une seule obligation à trois destinataires, telle qu'elle a été énoncée (SRC-030). Les scinder inventerait trois règles que personne n'a formulées." }
  - id: RG-005
    statement: "Le dossier de l'enfant doit être remis aux médecins des urgences."
    rationale_proposed: "PROPOSÉ par l'agent le 2026-10-28, NON CONFIRMÉ : l'équipe médicale a besoin des allergies, des vaccinations et du médecin traitant pour soigner, et ces informations ne se trouvent nulle part ailleurs tant que les parents ne sont pas arrivés."
    kind: comportement
    enforcement: stricte      # jamais appliquée à ce jour (SRC-029)
    sources: [{ ref: SRC-030, location: "« on doit prendre le dossier de l'enfant pour les médecins des urgences »" }]
    owner: SH-02
    rationale: ""
    exceptions: []
    status: validé
    validated_by: SH-02   # validées en bloc le 2026-10-28 ; RG-001 validée dans son texte actuel, sa raison d'être restant inconnue, et elle sera réécrite par DD-05
    notes: "Séparée de RG-004 : autre acteur. « On » n'a pas de sujet, et le dossier est au bureau pendant que l'enfant part en ambulance (ZO-093). C'est la règle qui contraint le plus la suite : elle suppose que les informations de santé puissent QUITTER l'association et être lues par un tiers (BC-008)."
  - id: RG-001
    statement: "Tout paiement encaissé pour frais d'inscription ou frais de scolarité ne peut faire l'objet d'un remboursement."
    kind: comportement
    enforcement: derogation_justifiee   # le règlement l'énonce sans exception, la pratique en admet au moins une
    sources: [{ ref: SRC-003, location: "règlement intérieur, article 7" }, { ref: SRC-011, location: "remboursement effectué en septembre" }]
    owner: SH-02
    rationale: "JAMAIS ÉTABLIE : demandée deux fois à SH-02 le 2026-10-28, sans réponse. C'est ce vide qui a conduit à demander si la règle était encore valable plutôt qu'à la reconduire — d'où DD-05."
    revision_note: "Sera réécrite lors de la révision du règlement (DD-04, DD-05, TR-01) pour porter l'exception RG-002 dans son texte. Tant que la révision n'est pas faite, le texte signé par les familles reste celui-ci, sans exception."
    exceptions: [RG-002]
    status: validé
    validated_by: SH-02   # validées en bloc le 2026-10-28 ; RG-001 validée dans son texte actuel, sa raison d'être restant inconnue, et elle sera réécrite par DD-05
    lint_waivers:
      - { rule: L03, reason: "L'énoncé est la citation exacte de l'article 7 du règlement intérieur signé par les parents (SRC-003). On ne le reformule pas : c'est le texte qui engage." }
      - { rule: L08, reason: "Même motif : le règlement ne dit pas « doit ». C'est précisément ce flou qui a rendu RG-002 nécessaire." }
  - id: RG-003
    statement: "Toute inscription doit être réglée par virement bancaire."
    kind: comportement
    enforcement: stricte
    sources: [{ ref: SRC-022, location: "« toutes les inscriptions se font par virement »" }]
    owner: SH-02
    rationale: "Le paiement est échelonné entre avril et juin (SRC-044) : la première somme arrive donc tôt dans la campagne, ce qui donne au filet de détection de BR-009 une trace précoce et non un signal de juillet. Pratique constante selon SH-03. Elle n'est pas celle qu'annonce le règlement intérieur signé, qui prévoit encore un paiement en trois fois avec deux chèques différés et une option chèques à 2 € de frais (SRC-003, page 2) — ZO-082"
    exceptions: []
    status: validé
    validated_by: SH-02   # validées en bloc le 2026-10-28 ; RG-001 validée dans son texte actuel, sa raison d'être restant inconnue, et elle sera réécrite par DD-05
  - id: RG-002
    statement: "Un paiement encaissé doit être remboursé lorsque l'association n'a pas pu donner suite à l'inscription parce qu'elle a perdu le dossier déposé."
    kind: comportement
    enforcement: stricte
    sources: [{ ref: SRC-018, location: "« dans les cas où l'erreur n'incombe pas au parent »" }, { ref: SRC-011, location: "remboursement effectué en septembre" }]
    owner: SH-02
    rationale: "Pratiquée au moins une fois (SRC-011) et énoncée par le président. N'est PAS la seule dérogation : d'autres remboursements arrivent « de temps à autre », motifs non énoncés (SRC-023, ZO-084). Absente du règlement signé, donc inopposable par une famille en l'état (ZO-078, ZO-079)"
    exceptions: []
    status: validé
    validated_by: SH-02   # validées en bloc le 2026-10-28 ; RG-001 validée dans son texte actuel, sa raison d'être restant inconnue, et elle sera réécrite par DD-05
# règles métier : ce ne sont pas des exigences, mais des directives que le métier contrôle
