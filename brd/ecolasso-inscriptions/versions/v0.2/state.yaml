glossary:
  - { term: "Institut ESC", definition: "Nom sous lequel l'association exerce ; figure sur le dossier d'inscription et dans le règlement intérieur, qui parlent de « la Direction de l'Institut »", source: SRC-003 }
  - { term: "Association (loi 1901)", definition: "Forme juridique de la structure. C'est la personne morale responsable des données personnelles collectées, représentée selon ses statuts", source: SRC-016 }
  # CONFIRMÉS par SH-02 le 2026-10-28, sauf « Famille attendue » qui reste à définir
  - { term: "Campagne", definition: "La période pendant laquelle les inscriptions et les réinscriptions sont reçues : d'avril à juin", source: SRC-007 }
  - { term: "Réinscription", definition: "Inscription d'un enfant dont la famille est déjà connue de l'association ; environ 135 par campagne", source: SRC-007 }
  - { term: "Primo-inscription", definition: "Première inscription d'un enfant dont la famille n'est pas connue de l'association ; 10 à 15 par campagne, et la population du risque R-03", source: SRC-023 }
  - { term: "Dossier d'inscription", definition: "L'ensemble des informations et des pièces qu'une famille remet pour inscrire un enfant : treize pièces, douze rubriques d'information", source: SRC-003 }
  - { term: "Dossier incomplet", definition: "Dossier dans lequel une information ou une pièce obligatoire manque par omission — document non signé, numéro non renseigné. À DÉFINIR PRÉCISÉMENT : c'est un indicateur de réussite du dossier et sa valeur de départ n'est pas connue (ZO-025)", source: SRC-047 }
  - { term: "Relance", definition: "Le fait, pour un membre du bureau, de reprendre contact avec une famille attendue dont le dossier n'est pas arrivé", source: SRC-042 }
  - { term: "Famille attendue", definition: "Famille figurant sur la liste de la campagne précédente, ou dont un paiement a été reçu (DD-06). C'est ce terme qui fixe la portée de BR-009 : la relance couvre donc les réinscriptions ET les primo-inscriptions ayant payé", source: DD-06 }
